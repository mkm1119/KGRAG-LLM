<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#44546a"/></marker><marker id="arg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2e7d32"/></marker><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78909c"/></marker></defs><rect width="1500" height="1000" fill="#fff"/><rect x="15" y="15" width="1470" height="300" rx="18" fill="#f3f0fa" stroke="#9c8fc7" stroke-width="2"/><text x="40" y="65" font-size="34" font-weight="bold" fill="#4527a0" text-anchor="start">STEP 1. Ontology 설계: 먼저 정한 설계도</text><rect x="40" y="95" width="400" height="205" rx="14" fill="#ede7f6" stroke="#7e57c2" stroke-width="3"/><text x="240" y="139" font-size="28" font-weight="bold" fill="#311b92" text-anchor="middle">답해야 할 질문 7개</text><text x="240" y="188" font-size="25" fill="#37474f" text-anchor="middle">예) 지금 제한수위는?</text><text x="240" y="223" font-size="25" fill="#37474f" text-anchor="middle">비슷했던 과거의 승인은?</text><rect x="500" y="95" width="520" height="205" rx="14" fill="#ede7f6" stroke="#7e57c2" stroke-width="3"/><text x="760" y="139" font-size="28" font-weight="bold" fill="#311b92" text-anchor="middle">개체 6종류 · 관계 9종류</text><text x="760" y="188" font-size="25" fill="#37474f" text-anchor="middle">댐, 수문기상 상태, 방류 승인,</text><text x="760" y="223" font-size="25" fill="#37474f" text-anchor="middle">운영행위, 운영기준, 근거자료</text><text x="760" y="258" font-size="25" fill="#37474f" text-anchor="middle">관계 예) 승인이 운영행위를 허가</text><rect x="1080" y="95" width="380" height="205" rx="14" fill="#ede7f6" stroke="#7e57c2" stroke-width="3"/><text x="1270" y="139" font-size="28" font-weight="bold" fill="#311b92" text-anchor="middle">설계도의 쓰임</text><text x="1270" y="188" font-size="25" fill="#37474f" text-anchor="middle">① KG를 만드는 틀</text><text x="1270" y="223" font-size="25" fill="#37474f" text-anchor="middle">② 질문 유형의 기준</text><line x1="442" y1="200" x2="498" y2="200" stroke="#7e57c2" stroke-width="4" marker-end="url(#arp)"/><line x1="1022" y1="200" x2="1078" y2="200" stroke="#7e57c2" stroke-width="4" marker-end="url(#arp)"/><line x1="760" y1="302" x2="760" y2="392" stroke="#7e57c2" stroke-width="4" marker-end="url(#arp)"/><text x="785" y="360" font-size="26" fill="#4527a0" text-anchor="start">이 설계에 맞춰 구축</text><rect x="15" y="395" width="1470" height="590" rx="18" fill="#f7f9fc" stroke="#9fb3c8" stroke-width="2"/><text x="40" y="445" font-size="34" font-weight="bold" fill="#1f4e79" text-anchor="start">STEP 2. 사전 구축: 자료를 구조화해 세 저장소에 담는다</text><text x="40" y="487" font-size="25" fill="#44546a" text-anchor="start">한 번 수행하고 자료가 바뀌면 갱신한다. LLM 없이 미리 정한 규칙으로 자동 처리한다.</text><rect x="40" y="520" width="380" height="130" rx="14" fill="#eceff1" stroke="#78909c" stroke-width="3"/><text x="230" y="564" font-size="27" font-weight="bold" fill="#263238" text-anchor="middle">방류 승인 기록 (표)</text><text x="230" y="613" font-size="25" fill="#37474f" text-anchor="middle">4개 댐 80건</text><rect x="40" y="670" width="380" height="130" rx="14" fill="#eceff1" stroke="#78909c" stroke-width="3"/><text x="230" y="714" font-size="27" font-weight="bold" fill="#263238" text-anchor="middle">수문기상 자료 (표)</text><text x="230" y="763" font-size="25" fill="#37474f" text-anchor="middle">시간별 약 50.8만 줄</text><rect x="40" y="820" width="380" height="130" rx="14" fill="#eceff1" stroke="#78909c" stroke-width="3"/><text x="230" y="864" font-size="27" font-weight="bold" fill="#263238" text-anchor="middle">규정 별표3 (글)</text><text x="230" y="913" font-size="25" fill="#37474f" text-anchor="middle">홍수기 제한수위</text><rect x="500" y="520" width="460" height="430" rx="14" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/><text x="730" y="568" font-size="28" font-weight="bold" fill="#0d47a1" text-anchor="middle">KG 구축 7단계 (자동 처리)</text><text x="525" y="618" font-size="25" fill="#0d47a1" text-anchor="start">1 자료 유형 구분 (표/글)</text><text x="525" y="660" font-size="25" fill="#0d47a1" text-anchor="start">2 전처리 (중복·시각 정리)</text><text x="525" y="702" font-size="25" fill="#0d47a1" text-anchor="start">3 표의 열을 속성으로 매핑</text><text x="525" y="744" font-size="25" fill="#0d47a1" text-anchor="start">4 글에서 값 추출 (규칙)</text><text x="525" y="786" font-size="25" fill="#0d47a1" text-anchor="start">5 댐 이름·코드를 하나로 연결</text><text x="525" y="828" font-size="25" fill="#0d47a1" text-anchor="start">6 구조 규칙 검증</text><text x="525" y="870" font-size="25" fill="#0d47a1" text-anchor="start">7 저장 (Neo4j에 적재)</text><text x="730" y="930" font-size="24" fill="#37474f" text-anchor="middle">문헌 방법 참고, 그 외 연구자 판단</text><line x1="422" y1="585" x2="498" y2="655" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><line x1="422" y1="735" x2="498" y2="720" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><line x1="422" y1="885" x2="498" y2="785" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><rect x="1020" y="520" width="440" height="142" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="1240" y="564" font-size="27" font-weight="bold" fill="#1b5e20" text-anchor="middle">지식그래프 (Neo4j)</text><text x="1240" y="612" font-size="24" fill="#37474f" text-anchor="middle">개체(점) 273개</text><text x="1240" y="646" font-size="24" fill="#37474f" text-anchor="middle">관계(선) 457개</text><rect x="1020" y="670" width="440" height="142" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="1240" y="714" font-size="27" font-weight="bold" fill="#1b5e20" text-anchor="middle">측정자료 저장소</text><text x="1240" y="762" font-size="24" fill="#37474f" text-anchor="middle">시간별 값 전체</text><text x="1240" y="796" font-size="24" fill="#37474f" text-anchor="middle">(KG에는 번호만)</text><rect x="1020" y="820" width="440" height="142" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="1240" y="864" font-size="27" font-weight="bold" fill="#1b5e20" text-anchor="middle">문서 저장소</text><text x="1240" y="912" font-size="24" fill="#37474f" text-anchor="middle">별표3 원문 10조각</text><text x="1240" y="946" font-size="24" fill="#37474f" text-anchor="middle">(KG에는 번호만)</text><line x1="962" y1="655" x2="1018" y2="585" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><line x1="962" y1="720" x2="1018" y2="735" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><line x1="962" y1="785" x2="1018" y2="885" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/></svg></body></html>
