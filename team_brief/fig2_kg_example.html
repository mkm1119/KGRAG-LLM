<!doctype html><html><head><meta charset="utf-8"><style>

<rect x="520" y="330" width="300" height="106" rx="14" fill="#bbdefb" stroke="#1565c0" stroke-width="3"/>
<text x="670" y="366" font-size="17" fill="#0d47a1">Dam (댐)</text>
<text x="670" y="398" font-weight="bold" font-size="26">충주댐</text>
<text x="670" y="424" font-size="17" fill="#37474f">다목적댐</text>

<rect x="780" y="100" width="300" height="103" rx="14" fill="#e1bee7" stroke="#8e24aa" stroke-width="3"/>

<rect x="540" y="600" width="400" height="106" rx="14" fill="#fff9c4" stroke="#f9a825" stroke-width="3"/>

<text x="740" y="666" font-weight="bold">연계운영규정 별표3</text>

<rect x="1020" y="600" width="430" height="106" rx="14" fill="#fff9c4" stroke="#f9a825" stroke-width="3"/>

<text x="1235" y="666" font-weight="bold">K-water 수문 시간자료</text>
<text x="1235" y="692" font-size="17" fill="#37474f">댐코드 1003110, 시간별 자료</text>

<rect x="540" y="830" width="400" height="90" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" stroke-dasharray="9,7"/>
<text x="740" y="868" font-weight="bold" fill="#1b5e20">문서 저장소 (KG 밖)</text>
<text x="740" y="900" font-size="17" fill="#33691e">별표3 원문 전체 (표와 각주)</text>
<rect x="1020" y="814" width="430" height="92" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" stroke-dasharray="9,7"/>

<text x="40" y="60" font-size="24" font-weight="bold" fill="#1f4e79">지식그래프의 일부: 충주댐 승인 1368번 한 건</text>
<text x="40" y="88" font-size="18" fill="#546e7a">점(노드)은 개체, 실선 화살표는 의미 관계, 회색 화살표는 근거자료를 가리키는 관계(supportedBy), 파선은 KG 밖 저장소를 찾아가는 키이다.</text>
