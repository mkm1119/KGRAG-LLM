<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1611" viewBox="0 0 1500 1611"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#44546a"/></marker><marker id="arg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2e7d32"/></marker><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78909c"/></marker></defs><rect width="1500" height="1611" fill="#fff"/><rect x="15" y="15" width="1470" height="300" rx="18" fill="#f7f9fc" stroke="#9fb3c8" stroke-width="2"/><text x="40" y="65" font-size="34" font-weight="bold" fill="#1f4e79" text-anchor="start">연구의 큰 틀: 세 단계가 차례로 이어진다</text><rect x="40" y="100" width="440" height="190" rx="14" fill="#ede7f6" stroke="#7e57c2" stroke-width="3"/><text x="260" y="144" font-size="24" fill="#311b92" text-anchor="middle">STEP 1 설계</text><text x="260" y="190" font-size="31" font-weight="bold" fill="#311b92" text-anchor="middle">Ontology 설계</text><text x="260" y="239" font-size="25" fill="#37474f" text-anchor="middle">무엇이 있고 어떻게</text><text x="260" y="274" font-size="25" fill="#37474f" text-anchor="middle">연결되는지 정함</text><rect x="530" y="100" width="440" height="190" rx="14" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/><text x="750" y="144" font-size="24" fill="#0d47a1" text-anchor="middle">STEP 2 구축</text><text x="750" y="190" font-size="31" font-weight="bold" fill="#0d47a1" text-anchor="middle">지식그래프(KG) 구축</text><text x="750" y="239" font-size="25" fill="#37474f" text-anchor="middle">실제 자료를 설계에 맞게</text><text x="750" y="274" font-size="25" fill="#37474f" text-anchor="middle">정리해 저장</text><rect x="1020" y="100" width="440" height="190" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="1240" y="144" font-size="24" fill="#bf360c" text-anchor="middle">STEP 3 질문 응답</text><text x="1240" y="190" font-size="31" font-weight="bold" fill="#bf360c" text-anchor="middle">하이브리드 검색 + LLM</text><text x="1240" y="239" font-size="25" fill="#37474f" text-anchor="middle">세 곳에서 근거를 찾고</text><text x="1240" y="274" font-size="25" fill="#37474f" text-anchor="middle">LLM이 설명</text><line x1="482" y1="195" x2="528" y2="195" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><line x1="972" y1="195" x2="1018" y2="195" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><rect x="15" y="345" width="1470" height="1251" rx="18" fill="#fffaf2" stroke="#d9b36c" stroke-width="2"/><text x="40" y="395" font-size="34" font-weight="bold" fill="#7a4b00" text-anchor="start">STEP 3 질문 응답과 하이브리드 검색</text><rect x="40" y="425" width="680" height="165" rx="14" fill="#f5f5f5" stroke="#757575" stroke-width="3"/><text x="380" y="469" font-size="30" font-weight="bold" fill="#212121" text-anchor="middle">사용자 질문</text><text x="380" y="518" font-size="25" fill="#37474f" text-anchor="middle">“소양강댐 지금 상태와</text><text x="380" y="553" font-size="25" fill="#37474f" text-anchor="middle">비슷했던 과거 사례는?”</text><rect x="780" y="425" width="680" height="165" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="1120" y="469" font-size="30" font-weight="bold" fill="#bf360c" text-anchor="middle">질문 해석 (LLM)</text><text x="1120" y="518" font-size="25" fill="#37474f" text-anchor="middle">어느 댐, 어느 시점에 대해</text><text x="1120" y="553" font-size="25" fill="#37474f" text-anchor="middle">무엇을 묻는지 정리</text><line x1="722" y1="507" x2="778" y2="507" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><line x1="1120" y1="592" x2="1120" y2="638" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><rect x="40" y="640" width="1420" height="585" rx="16" fill="#f1f8f1" stroke="#2e7d32" stroke-width="3" stroke-dasharray="12 8"/><text x="750" y="688" font-size="31" font-weight="bold" fill="#1b5e20" text-anchor="middle">하이브리드 검색: 출처마다 맞는 방식으로 찾는다</text><rect x="65" y="715" width="1370" height="175" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="750" y="759" font-size="30" font-weight="bold" fill="#1b5e20" text-anchor="middle">① 지식그래프(KG) 검색: 관계를 따라간다</text><text x="750" y="809" font-size="26" fill="#37474f" text-anchor="middle">댐 → 승인 → 운영행위 → 운영기준처럼 연결을 따라가며</text><text x="750" y="845" font-size="26" fill="#37474f" text-anchor="middle">관련 승인·기준과 근거의 위치(번호)를 알아낸다</text><line x1="400" y1="892" x2="400" y2="962" stroke="#2e7d32" stroke-width="4" marker-end="url(#arg)"/><line x1="1100" y1="892" x2="1100" y2="962" stroke="#2e7d32" stroke-width="4" marker-end="url(#arg)"/><text x="425" y="937" font-size="25" fill="#2e7d32" text-anchor="start">찾아갈 번호</text><text x="1125" y="937" font-size="25" fill="#2e7d32" text-anchor="start">찾아갈 번호</text><rect x="65" y="966" width="670" height="205" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="400" y="1010" font-size="30" font-weight="bold" fill="#1b5e20" text-anchor="middle">② 측정자료 검색</text><text x="400" y="1060" font-size="26" fill="#37474f" text-anchor="middle">KG가 알려 준 측정소 번호로</text><text x="400" y="1096" font-size="26" fill="#37474f" text-anchor="middle">시간별 수위·방류량 등의</text><text x="400" y="1132" font-size="26" fill="#37474f" text-anchor="middle">숫자를 읽어 온다</text><rect x="765" y="966" width="670" height="205" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="1100" y="1010" font-size="30" font-weight="bold" fill="#1b5e20" text-anchor="middle">③ 문서 검색</text><text x="1100" y="1060" font-size="26" fill="#37474f" text-anchor="middle">KG가 알려 준 조각 번호로</text><text x="1100" y="1096" font-size="26" fill="#37474f" text-anchor="middle">규정 원문을 읽어 온다</text><line x1="750" y1="1227" x2="750" y2="1278" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><rect x="40" y="1280" width="1420" height="150" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="750" y="1324" font-size="31" font-weight="bold" fill="#bf360c" text-anchor="middle">근거 통합 · LLM 답변</text><text x="750" y="1374" font-size="26" fill="#37474f" text-anchor="middle">세 곳의 근거를 합쳐 근거 안에서만 설명하고 출처를 표시</text><text x="40" y="1475" font-size="25" fill="#44546a" text-anchor="start">KG에는 수치 전체나 원문 전체를 넣지 않고 연결 관계와 근거의 위치만 둔다.</text><text x="40" y="1513" font-size="25" fill="#44546a" text-anchor="start">숫자는 측정자료 저장소에, 원문은 문서 저장소에 있다. 주황색은 LLM이 하는 일이다.</text><text x="40" y="1551" font-size="25" fill="#44546a" text-anchor="start">STEP 1의 Ontology는 KG를 만드는 틀이며, 질문 유형을 나누는 기준도 된다.</text></svg></body></html>
