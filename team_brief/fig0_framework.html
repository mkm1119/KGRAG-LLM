<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
<defs>
<marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#44546a"/></marker>
<marker id="ar2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2e7d32"/></marker>

<rect width="1500" height="720" fill="#fff"/>

<!-- Panel 1 -->
<rect x="15" y="15" width="1470" height="215" rx="16" fill="#f7f9fc" stroke="#9fb3c8" stroke-width="2"/>
<text x="40" y="55" font-size="28" font-weight="bold" fill="#1f4e79">연구의 큰 틀: 세 단계가 차례로 이어진다</text>
<g>
<rect x="40" y="80" width="420" height="125" rx="12" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/>
<text x="250" y="112" text-anchor="middle" font-size="19" fill="#1565c0">STEP 1  지식 설계</text>
<text x="250" y="146" text-anchor="middle" font-size="25" font-weight="bold" fill="#0d47a1">Ontology 설계</text>
<text x="250" y="180" text-anchor="middle" font-size="19" fill="#37474f">무엇이 존재하고 어떻게 연결되는지 정의</text>
<rect x="540" y="80" width="420" height="125" rx="12" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/>
<text x="750" y="112" text-anchor="middle" font-size="19" fill="#1565c0">STEP 2  지식 구축</text>
<text x="750" y="146" text-anchor="middle" font-size="25" font-weight="bold" fill="#0d47a1">KG 구축</text>
<text x="750" y="180" text-anchor="middle" font-size="19" fill="#37474f">실제 자료를 설계에 맞게 개체·관계·값으로 구성</text>
<rect x="1040" y="80" width="420" height="125" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/>
<text x="1250" y="112" text-anchor="middle" font-size="19" fill="#e65100">STEP 3  질문 응답</text>
<text x="1250" y="146" text-anchor="middle" font-size="25" font-weight="bold" fill="#bf360c">Hybrid Retrieval + LLM</text>
<text x="1250" y="180" text-anchor="middle" font-size="19" fill="#5d4037">KG·문서·측정자료에서 근거를 찾고 LLM이 설명</text>
</g>
<line x1="462" y1="142" x2="538" y2="142" stroke="#44546a" stroke-width="3" marker-end="url(#ar)"/>
<line x1="962" y1="142" x2="1038" y2="142" stroke="#44546a" stroke-width="3" marker-end="url(#ar)"/>

<!-- Panel 2 -->
<rect x="15" y="255" width="1470" height="450" rx="16" fill="#fffaf2" stroke="#d9b36c" stroke-width="2"/>
<text x="40" y="295" font-size="28" font-weight="bold" fill="#7a4b00">STEP 3의 질문 응답 흐름과 KG의 위치</text>
<g font-size="22">
<rect x="40" y="320" width="190" height="105" rx="12" fill="#f5f5f5" stroke="#757575" stroke-width="2"/>
<text x="135" y="365" text-anchor="middle" font-weight="bold" fill="#212121">사용자 질문</text>
<text x="135" y="396" text-anchor="middle" font-size="17" fill="#424242">자연어</text>
<rect x="270" y="320" width="250" height="105" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/>
<text x="395" y="358" text-anchor="middle" font-weight="bold" fill="#e65100">질문 해석</text>
<text x="395" y="388" text-anchor="middle" font-size="17" fill="#5d4037">대상·시간·요청 정보·</text>
<text x="395" y="410" text-anchor="middle" font-size="17" fill="#5d4037">조건으로 해석</text>
<rect x="560" y="320" width="270" height="105" rx="12" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/>
<text x="695" y="358" text-anchor="middle" font-weight="bold" fill="#0d47a1">필요 정보 구조화</text>
<text x="695" y="388" text-anchor="middle" font-size="17" fill="#37474f">Ontology를 이용해 어떤</text>
<text x="695" y="410" text-anchor="middle" font-size="17" fill="#37474f">정보가 필요한지 정리</text>
<rect x="870" y="320" width="250" height="105" rx="12" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/>
<text x="995" y="358" text-anchor="middle" font-weight="bold" fill="#0d47a1">근거 검색</text>
<text x="995" y="388" text-anchor="middle" font-size="17" fill="#37474f">Hybrid Retrieval</text>
<text x="995" y="410" text-anchor="middle" font-size="17" fill="#37474f">KG·문서·측정자료</text>
<rect x="1160" y="320" width="300" height="105" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/>
<text x="1310" y="358" text-anchor="middle" font-weight="bold" fill="#e65100">근거 통합 · LLM 답변</text>
<text x="1310" y="388" text-anchor="middle" font-size="17" fill="#5d4037">근거 안에서만 설명,</text>
<text x="1310" y="410" text-anchor="middle" font-size="17" fill="#5d4037">근거 출처 표시</text>
</g>
<line x1="232" y1="372" x2="268" y2="372" stroke="#44546a" stroke-width="3" marker-end="url(#ar)"/>
<line x1="522" y1="372" x2="558" y2="372" stroke="#44546a" stroke-width="3" marker-end="url(#ar)"/>
<line x1="832" y1="372" x2="868" y2="372" stroke="#44546a" stroke-width="3" marker-end="url(#ar)"/>
<line x1="1122" y1="372" x2="1158" y2="372" stroke="#44546a" stroke-width="3" marker-end="url(#ar)"/>

<!-- stores -->
<g font-size="22">
<rect x="250" y="495" width="300" height="115" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
<text x="400" y="530" text-anchor="middle" font-weight="bold" fill="#1b5e20">문서 저장소</text>
<text x="400" y="562" text-anchor="middle" font-size="17" fill="#33691e">규정 같은 원문 전체</text>
<text x="400" y="587" text-anchor="middle" font-size="17" fill="#33691e">(STEP 2에서 구축)</text>
<rect x="600" y="480" width="330" height="145" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/>
<text x="765" y="515" text-anchor="middle" font-weight="bold" fill="#1b5e20">지식그래프 (KG)</text>
<text x="765" y="547" text-anchor="middle" font-size="17" fill="#33691e">상태·운영·승인·기준·근거의</text>
<text x="765" y="570" text-anchor="middle" font-size="17" fill="#33691e">의미 관계와 근거의 위치를 담는</text>
<text x="765" y="593" text-anchor="middle" font-size="17" fill="#33691e">중심 구조</text>
<rect x="980" y="495" width="300" height="115" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
<text x="1130" y="530" text-anchor="middle" font-weight="bold" fill="#1b5e20">측정자료 저장소</text>
<text x="1130" y="562" text-anchor="middle" font-size="17" fill="#33691e">시간별 측정값 전체</text>
<text x="1130" y="587" text-anchor="middle" font-size="17" fill="#33691e">(STEP 2에서 구축)</text>
</g>
<line x1="602" y1="552" x2="552" y2="552" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ar2)"/>
<line x1="928" y1="552" x2="978" y2="552" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ar2)"/>
<!-- up to retrieval -->
<path d="M400,493 L400,455 L1130,455 L1130,493" fill="none" stroke="#2e7d32" stroke-width="3"/>
<path d="M765,478 L765,455" fill="none" stroke="#2e7d32" stroke-width="3"/>
<path d="M995,455 L995,428" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#ar2)"/>
<text x="1020" y="450" font-size="17" fill="#2e7d32">세 곳에서 근거를 가져온다</text>
<text x="40" y="670" font-size="19" fill="#44546a">KG는 모든 자료를 직접 저장하지 않고, 의미 관계와 근거의 위치를 담아 문서와 측정자료를 찾아가게 하는 중심 구조이다.</text>
<text x="40" y="695" font-size="19" fill="#44546a">주황색: LLM이 하는 일, 파란색: Ontology·규칙을 이용한 처리, 초록색: 저장소.</text>
</svg></body></html>
