<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1345" viewBox="0 0 1500 1345"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#44546a"/></marker><marker id="arg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2e7d32"/></marker><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78909c"/></marker></defs><rect width="1500" height="1345" fill="#fff"/><rect x="40" y="15" width="1420" height="125" rx="14" fill="#ede7f6" stroke="#7e57c2" stroke-width="3"/><text x="750" y="59" font-size="32" font-weight="bold" fill="#311b92" text-anchor="middle">STEP 1  Ontology 설계</text><text x="750" y="108" font-size="25" fill="#37474f" text-anchor="middle">무엇이 있고 어떻게 연결되는지 정한 설계도 (개체 6종류, 관계 9종류)</text><line x1="750" y1="142" x2="750" y2="193" stroke="#7e57c2" stroke-width="4" marker-end="url(#arp)"/><text x="778" y="176" font-size="26" fill="#4527a0" text-anchor="start">설계에 맞춰 구축</text><rect x="40" y="195" width="1420" height="140" rx="14" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/><text x="750" y="239" font-size="32" font-weight="bold" fill="#0d47a1" text-anchor="middle">STEP 2  지식그래프(KG) 구축 (자동 처리)</text><text x="750" y="288" font-size="25" fill="#37474f" text-anchor="middle">원자료(방류 승인 기록, 수문기상 시간 자료, 규정 별표3)를</text><text x="750" y="323" font-size="25" fill="#37474f" text-anchor="middle">설계에 맞게 정리해 세 저장소에 나누어 담는다</text><line x1="240" y1="337" x2="240" y2="418" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><line x1="750" y1="337" x2="750" y2="418" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><line x1="1260" y1="337" x2="1260" y2="418" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><rect x="40" y="420" width="400" height="150" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="240" y="464" font-size="29" font-weight="bold" fill="#1b5e20" text-anchor="middle">문서 저장소</text><text x="240" y="513" font-size="25" fill="#37474f" text-anchor="middle">규정 원문 전체</text><rect x="550" y="420" width="400" height="150" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="750" y="464" font-size="29" font-weight="bold" fill="#1b5e20" text-anchor="middle">지식그래프 (KG)</text><text x="750" y="513" font-size="25" fill="#37474f" text-anchor="middle">관계와 근거의 위치(번호)</text><rect x="1060" y="420" width="400" height="150" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="1260" y="464" font-size="29" font-weight="bold" fill="#1b5e20" text-anchor="middle">측정자료 저장소</text><text x="1260" y="513" font-size="25" fill="#37474f" text-anchor="middle">시간별 측정값 전체</text><rect x="15" y="610" width="1470" height="602" rx="18" fill="#fffaf2" stroke="#d9b36c" stroke-width="2"/><text x="300" y="658" font-size="34" font-weight="bold" fill="#7a4b00" text-anchor="start">STEP 3  질문 응답</text><rect x="25" y="680" width="1450" height="275" rx="16" fill="#f1f8f1" stroke="#2e7d32" stroke-width="3" stroke-dasharray="12 8"/><rect x="40" y="705" width="400" height="175" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="240" y="749" font-size="29" font-weight="bold" fill="#1b5e20" text-anchor="middle">문서 검색</text><text x="240" y="797" font-size="24" fill="#37474f" text-anchor="middle">KG가 알려 준 조각 번호로</text><text x="240" y="831" font-size="24" fill="#37474f" text-anchor="middle">규정 원문을 읽어 온다</text><rect x="550" y="705" width="400" height="175" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="750" y="749" font-size="29" font-weight="bold" fill="#1b5e20" text-anchor="middle">KG 검색</text><text x="750" y="797" font-size="24" fill="#37474f" text-anchor="middle">연결을 따라가며 관련 승인·</text><text x="750" y="831" font-size="24" fill="#37474f" text-anchor="middle">기준과 근거의 위치를 찾는다</text><rect x="1060" y="705" width="400" height="175" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="1260" y="749" font-size="29" font-weight="bold" fill="#1b5e20" text-anchor="middle">측정자료 검색</text><text x="1260" y="797" font-size="24" fill="#37474f" text-anchor="middle">KG가 알려 준 측정소 번호로</text><text x="1260" y="831" font-size="24" fill="#37474f" text-anchor="middle">시간별 숫자를 읽어 온다</text><line x1="240" y1="572" x2="240" y2="703" stroke="#2e7d32" stroke-width="4" marker-end="url(#arg)"/><line x1="750" y1="572" x2="750" y2="703" stroke="#2e7d32" stroke-width="4" marker-end="url(#arg)"/><line x1="1260" y1="572" x2="1260" y2="703" stroke="#2e7d32" stroke-width="4" marker-end="url(#arg)"/><line x1="548" y1="805" x2="442" y2="805" stroke="#2e7d32" stroke-width="4" marker-end="url(#arg)"/><line x1="952" y1="805" x2="1058" y2="805" stroke="#2e7d32" stroke-width="4" marker-end="url(#arg)"/><text x="495" y="787" font-size="25" fill="#2e7d32" text-anchor="middle">번호</text><text x="1005" y="787" font-size="25" fill="#2e7d32" text-anchor="middle">번호</text><text x="750" y="932" font-size="28" font-weight="bold" fill="#1b5e20" text-anchor="middle">하이브리드 검색: 출처마다 맞는 방식으로 찾아 합친다</text><rect x="40" y="1017" width="330" height="165" rx="14" fill="#f5f5f5" stroke="#757575" stroke-width="3"/><text x="205" y="1061" font-size="29" font-weight="bold" fill="#212121" text-anchor="middle">사용자 질문</text><text x="205" y="1109" font-size="24" fill="#37474f" text-anchor="middle">“소양강댐 지금 상태와</text><text x="205" y="1143" font-size="24" fill="#37474f" text-anchor="middle">비슷했던 과거 사례는?”</text><rect x="430" y="1017" width="430" height="165" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="645" y="1061" font-size="29" font-weight="bold" fill="#bf360c" text-anchor="middle">질문 해석 (LLM)</text><text x="645" y="1109" font-size="24" fill="#37474f" text-anchor="middle">어느 댐, 어느 시점에 대해</text><text x="645" y="1143" font-size="24" fill="#37474f" text-anchor="middle">무엇을 묻는지 정리</text><rect x="1000" y="1017" width="460" height="165" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="1230" y="1061" font-size="29" font-weight="bold" fill="#bf360c" text-anchor="middle">근거 통합 · LLM 답변</text><text x="1230" y="1109" font-size="24" fill="#37474f" text-anchor="middle">합친 근거 안에서만 설명하고</text><text x="1230" y="1143" font-size="24" fill="#37474f" text-anchor="middle">출처를 표시한다</text><line x1="372" y1="1099" x2="428" y2="1099" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><line x1="645" y1="1015" x2="645" y2="957" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><text x="668" y="999" font-size="25" fill="#44546a" text-anchor="start">찾을 내용</text><line x1="1230" y1="957" x2="1230" y2="1015" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><text x="1253" y="999" font-size="25" fill="#44546a" text-anchor="start">모은 근거</text><text x="40" y="1267" font-size="25" fill="#44546a" text-anchor="start">KG에는 수치 전체나 원문 전체를 넣지 않고, 연결 관계와 근거의 위치(번호)만 둔다.</text><text x="40" y="1305" font-size="25" fill="#44546a" text-anchor="start">주황색은 LLM이 하는 일이다. 질문은 해석 → 하이브리드 검색 → 답변 순서로 처리된다.</text></svg></body></html>
