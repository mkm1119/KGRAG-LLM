<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}
svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800">
<defs>
<marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#44546a"/></marker>
<marker id="ar2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2e7d32"/></marker>
</defs>
<rect width="1500" height="800" fill="#fff"/>

<!-- Panel 1 -->
<rect x="15" y="15" width="1470" height="215" rx="16" fill="#f7f9fc" stroke="#9fb3c8" stroke-width="2"/>
<text x="40" y="55" font-size="28" font-weight="bold" fill="#1f4e79">연구의 큰 틀: 세 단계가 차례로 이어진다</text>
<rect x="40" y="80" width="420" height="125" rx="12" fill="#ede7f6" stroke="#7e57c2" stroke-width="3"/>
<text x="250" y="112" text-anchor="middle" font-size="19" fill="#5e35b1">STEP 1  설계</text>
<text x="250" y="146" text-anchor="middle" font-size="25" font-weight="bold" fill="#311b92">Ontology 설계</text>
<text x="250" y="180" text-anchor="middle" font-size="19" fill="#37474f">무엇이 있고 어떻게 연결되는지 정함</text>
<rect x="540" y="80" width="420" height="125" rx="12" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/>
<text x="750" y="112" text-anchor="middle" font-size="19" fill="#1565c0">STEP 2  구축</text>
<text x="750" y="146" text-anchor="middle" font-size="25" font-weight="bold" fill="#0d47a1">지식그래프(KG) 구축</text>
<text x="750" y="180" text-anchor="middle" font-size="19" fill="#37474f">실제 자료를 설계에 맞게 정리해 저장</text>
<rect x="1040" y="80" width="420" height="125" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/>
<text x="1250" y="112" text-anchor="middle" font-size="19" fill="#e65100">STEP 3  질문 응답</text>
<text x="1250" y="146" text-anchor="middle" font-size="25" font-weight="bold" fill="#bf360c">하이브리드 검색 + LLM</text>
<text x="1250" y="180" text-anchor="middle" font-size="19" fill="#37474f">세 곳에서 근거를 찾고 LLM이 설명</text>
<line x1="462" y1="142" x2="538" y2="142" stroke="#44546a" stroke-width="3" marker-end="url(#ar)"/>
<line x1="962" y1="142" x2="1038" y2="142" stroke="#44546a" stroke-width="3" marker-end="url(#ar)"/>

<!-- Panel 2 -->
<rect x="15" y="255" width="1470" height="530" rx="16" fill="#fffaf2" stroke="#d9b36c" stroke-width="2"/>
<text x="40" y="295" font-size="28" font-weight="bold" fill="#7a4b00">STEP 3 질문 응답: 하이브리드 검색은 질문에 필요한 근거를 서로 다른 세 곳에서 찾아 합친다</text>

<rect x="40" y="440" width="220" height="115" rx="12" fill="#f5f5f5" stroke="#757575" stroke-width="2"/>
<text x="150" y="480" text-anchor="middle" font-size="22" font-weight="bold" fill="#212121">사용자 질문</text>
<text x="150" y="512" text-anchor="middle" font-size="16" fill="#424242">"소양강댐 지금 상태와</text>
<text x="150" y="534" text-anchor="middle" font-size="16" fill="#424242">비슷했던 과거 사례는?"</text>

<rect x="300" y="440" width="250" height="115" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/>
<text x="425" y="478" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">질문 해석 (LLM)</text>
<text x="425" y="508" text-anchor="middle" font-size="16" fill="#5d4037">어느 댐, 어느 시점에 대해</text>
<text x="425" y="530" text-anchor="middle" font-size="16" fill="#5d4037">무엇을 묻는지 정리</text>

<rect x="590" y="320" width="560" height="365" rx="14" fill="#f1f8f1" stroke="#2e7d32" stroke-width="3" stroke-dasharray="10 6"/>
<text x="870" y="352" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b5e20">하이브리드 검색: 출처별 방식으로 찾는다</text>

<rect x="610" y="372" width="520" height="115" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
<text x="870" y="406" text-anchor="middle" font-size="21" font-weight="bold" fill="#1b5e20">① 지식그래프(KG) 검색: 관계를 따라간다</text>
<text x="870" y="436" text-anchor="middle" font-size="16" fill="#33691e">댐 → 승인 → 운영행위 → 운영기준처럼 연결을 따라가며</text>
<text x="870" y="459" text-anchor="middle" font-size="16" fill="#33691e">관련 승인·기준과 "근거가 어디에 있는지"를 알아낸다</text>

<rect x="610" y="545" width="250" height="125" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
<text x="735" y="577" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b5e20">② 측정자료 검색</text>
<text x="735" y="607" text-anchor="middle" font-size="16" fill="#33691e">KG가 알려 준 측정소 번호로</text>
<text x="735" y="629" text-anchor="middle" font-size="16" fill="#33691e">시간별 수위·방류량 등의</text>
<text x="735" y="651" text-anchor="middle" font-size="16" fill="#33691e">숫자를 읽어 온다</text>
<rect x="880" y="545" width="250" height="125" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
<text x="1005" y="577" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b5e20">③ 문서 검색</text>
<text x="1005" y="607" text-anchor="middle" font-size="16" fill="#33691e">KG가 알려 준 조각 번호로</text>
<text x="1005" y="629" text-anchor="middle" font-size="16" fill="#33691e">규정 원문을 읽어 온다</text>
<line x1="735" y1="489" x2="735" y2="543" stroke="#2e7d32" stroke-width="3" marker-end="url(#ar2)"/>
<line x1="1005" y1="489" x2="1005" y2="543" stroke="#2e7d32" stroke-width="3" marker-end="url(#ar2)"/>
<text x="768" y="522" font-size="15" fill="#2e7d32">찾아갈 번호</text>
<text x="1038" y="522" font-size="15" fill="#2e7d32">찾아갈 번호</text>

<rect x="1190" y="440" width="270" height="115" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/>
<text x="1325" y="478" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">근거 통합 · LLM 답변</text>
<text x="1325" y="508" text-anchor="middle" font-size="16" fill="#5d4037">세 곳의 근거를 합쳐</text>
<text x="1325" y="530" text-anchor="middle" font-size="16" fill="#5d4037">근거 안에서만 설명, 출처 표시</text>

<line x1="262" y1="497" x2="298" y2="497" stroke="#44546a" stroke-width="3" marker-end="url(#ar)"/>
<line x1="552" y1="497" x2="588" y2="497" stroke="#44546a" stroke-width="3" marker-end="url(#ar)"/>
<line x1="1152" y1="497" x2="1188" y2="497" stroke="#44546a" stroke-width="3" marker-end="url(#ar)"/>

<text x="40" y="722" font-size="19" fill="#44546a">KG에는 수치 전체나 원문 전체를 넣지 않고 연결 관계와 근거의 위치만 둔다. 숫자는 측정자료 저장소에, 원문은 문서 저장소에 있다.</text>
<text x="40" y="750" font-size="19" fill="#44546a">STEP 1의 Ontology는 KG를 만드는 틀이며, 질문이 어떤 유형인지 나누는 기준도 된다. 주황색은 LLM이 하는 일이다.</text>
</svg></body></html>
