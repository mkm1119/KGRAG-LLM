<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1015" viewBox="0 0 1500 1015"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#44546a"/></marker><marker id="arg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2e7d32"/></marker><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78909c"/></marker></defs><rect width="1500" height="1015" fill="#fff"/><rect x="15" y="15" width="1470" height="985" rx="18" fill="#fffaf2" stroke="#d9b36c" stroke-width="2"/><text x="40" y="65" font-size="34" font-weight="bold" fill="#7a4b00" text-anchor="start">STEP 3. 질문 처리: 질문이 올 때마다 수행한다</text><text x="40" y="107" font-size="25" fill="#44546a" text-anchor="start">LLM은 처음(질문 해석)과 끝(답변 작성)에만 쓰고, 가운데는 규칙으로 자동 처리한다.</text><rect x="40" y="140" width="680" height="160" rx="14" fill="#f5f5f5" stroke="#757575" stroke-width="3"/><text x="380" y="184" font-size="30" font-weight="bold" fill="#212121" text-anchor="middle">사용자 질문</text><text x="380" y="233" font-size="25" fill="#37474f" text-anchor="middle">“소양강댐 지금 상태와</text><text x="380" y="268" font-size="25" fill="#37474f" text-anchor="middle">비슷했던 과거 사례는?”</text><rect x="780" y="140" width="680" height="160" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="1120" y="184" font-size="30" font-weight="bold" fill="#bf360c" text-anchor="middle">① 질문 해석 [LLM]</text><text x="1120" y="233" font-size="25" fill="#37474f" text-anchor="middle">질문 유형과 댐·기간 값을</text><text x="1120" y="268" font-size="25" fill="#37474f" text-anchor="middle">정해진 형식(JSON)으로 출력</text><line x1="722" y1="220" x2="778" y2="220" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><line x1="1120" y1="302" x2="1120" y2="343" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><rect x="780" y="345" width="680" height="160" rx="14" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/><text x="1120" y="389" font-size="30" font-weight="bold" fill="#0d47a1" text-anchor="middle">② 값 검증 [자동]</text><text x="1120" y="438" font-size="25" fill="#37474f" text-anchor="middle">질문 유형, 댐, 날짜 형식 확인</text><text x="1120" y="473" font-size="25" fill="#37474f" text-anchor="middle">어긋나면 “범위 밖” 처리</text><rect x="40" y="345" width="680" height="160" rx="14" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/><text x="380" y="389" font-size="30" font-weight="bold" fill="#0d47a1" text-anchor="middle">③ KG 조회 [자동]</text><text x="380" y="438" font-size="25" fill="#37474f" text-anchor="middle">질문 유형별 조회문에 값을 채워</text><text x="380" y="473" font-size="25" fill="#37474f" text-anchor="middle">KG(Neo4j)에서 조회</text><line x1="778" y1="425" x2="722" y2="425" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><line x1="380" y1="507" x2="380" y2="548" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><rect x="40" y="550" width="680" height="160" rx="14" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/><text x="380" y="594" font-size="30" font-weight="bold" fill="#0d47a1" text-anchor="middle">④ 저장소 조회 [자동]</text><text x="380" y="643" font-size="25" fill="#37474f" text-anchor="middle">KG가 알려 준 번호로</text><text x="380" y="678" font-size="25" fill="#37474f" text-anchor="middle">측정값과 규정 원문을 읽어 옴</text><rect x="780" y="550" width="680" height="160" rx="14" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/><text x="1120" y="594" font-size="30" font-weight="bold" fill="#0d47a1" text-anchor="middle">⑤ 비교 값 계산 [자동]</text><text x="1120" y="643" font-size="25" fill="#37474f" text-anchor="middle">제한수위와의 차이, 승인량 대비</text><text x="1120" y="678" font-size="25" fill="#37474f" text-anchor="middle">비율, 비슷한 과거 사례 선택</text><line x1="722" y1="630" x2="778" y2="630" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><line x1="1120" y1="712" x2="1120" y2="753" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><rect x="780" y="755" width="680" height="160" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="1120" y="799" font-size="30" font-weight="bold" fill="#bf360c" text-anchor="middle">⑥ 답변 작성 [LLM]</text><text x="1120" y="848" font-size="25" fill="#37474f" text-anchor="middle">③~⑤ 결과를 번호 붙은 근거 모음으로</text><text x="1120" y="883" font-size="25" fill="#37474f" text-anchor="middle">받아 출처 번호를 붙여 한국어로 답변</text><rect x="40" y="755" width="680" height="160" rx="14" fill="#f5f5f5" stroke="#757575" stroke-width="3"/><text x="380" y="799" font-size="30" font-weight="bold" fill="#212121" text-anchor="middle">답변</text><text x="380" y="848" font-size="25" fill="#37474f" text-anchor="middle">+ 출처 번호</text><line x1="778" y1="835" x2="722" y2="835" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><rect x="40" y="942" width="36" height="36" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="90" y="970" font-size="25" fill="#37474f" text-anchor="start">LLM이 하는 일</text><rect x="390" y="942" width="36" height="36" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/><text x="440" y="970" font-size="25" fill="#37474f" text-anchor="start">규칙으로 자동 처리</text><rect x="800" y="942" width="36" height="36" rx="6" fill="#f5f5f5" stroke="#757575" stroke-width="3"/><text x="850" y="970" font-size="25" fill="#37474f" text-anchor="start">입출력</text></svg></body></html>
