<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1212" viewBox="0 0 1000 1212"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#44546a"/></marker><marker id="arg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2e7d32"/></marker><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78909c"/></marker></defs><rect width="1000" height="1212" fill="#fff"/><g transform="translate(5,5) scale(0.99)"><text x="0" y="20" font-size="24" font-weight="bold" fill="#1f3a5f" text-anchor="start">A. 구조 검사   (각 검사는 위반 목록을 세어 0건이면 통과)</text><text x="4" y="52" font-size="19" font-weight="bold" fill="#555" text-anchor="start">검사</text><text x="229" y="52" font-size="19" font-weight="bold" fill="#555" text-anchor="start">방법</text><text x="804" y="52" font-size="19" font-weight="bold" fill="#555" text-anchor="start">결과</text><rect x="0" y="64" width="215" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="85" font-size="18" fill="#222" text-anchor="start">관계의 양 끝 Class</text><rect x="225" y="64" width="565" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="231" y="85" font-size="18" fill="#222" text-anchor="start">관계 유형마다 Ontology가 허용한 (시작 Class, 끝 Class) 쌍과</text><text x="231" y="109" font-size="18" fill="#222" text-anchor="start">비교. 예: authorizes는 Approval → Operation만 허용</text><rect x="800" y="64" width="200" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="806" y="85" font-size="18" fill="#222" text-anchor="start">모든 관계, 위반 0건</text><rect x="0" y="124" width="215" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="145" font-size="18" fill="#222" text-anchor="start">필수 Data Property</text><rect x="225" y="124" width="565" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="231" y="145" font-size="18" fill="#222" text-anchor="start">Class별 필수 속성이 개체마다 있는지 확인. 예: Operation은</text><text x="231" y="169" font-size="18" fill="#222" text-anchor="start">operationType과 operationTime</text><rect x="800" y="124" width="200" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="806" y="145" font-size="18" fill="#222" text-anchor="start">모든 개체, 위반 0건</text><rect x="0" y="184" width="215" height="80" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="205" font-size="18" fill="#222" text-anchor="start">값 형식</text><rect x="225" y="184" width="565" height="80" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="231" y="205" font-size="18" fill="#222" text-anchor="start">approvalTime은 YYYY-MM-DD, operationTime은</text><text x="231" y="229" font-size="18" fill="#222" text-anchor="start">YYYY-MM-DDThh:mm, criterionValue는 숫자로 읽히는지 확인</text><rect x="800" y="184" width="200" height="80" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="806" y="205" font-size="18" fill="#222" text-anchor="start">Approval,</text><text x="806" y="229" font-size="18" fill="#222" text-anchor="start">Operation,</text><text x="806" y="253" font-size="18" fill="#222" text-anchor="start">Criterion, 위반 0건</text><rect x="0" y="268" width="215" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="289" font-size="18" fill="#222" text-anchor="start">근거 연결</text><rect x="225" y="268" width="565" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="231" y="289" font-size="18" fill="#222" text-anchor="start">상태, 운영행위, 승인, 운영기준 개체마다 supportedBy 관계가 1개 </text><text x="231" y="313" font-size="18" fill="#222" text-anchor="start">이상 있는지 확인</text><rect x="800" y="268" width="200" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="806" y="289" font-size="18" fill="#222" text-anchor="start">위반 0건</text><rect x="0" y="328" width="215" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="349" font-size="18" fill="#222" text-anchor="start">경로 일치</text><rect x="225" y="328" width="565" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="231" y="349" font-size="18" fill="#222" text-anchor="start">승인이 가리키는 댐(concernsDam)과 그 승인이 허가한 운영행위가 </text><text x="231" y="373" font-size="18" fill="#222" text-anchor="start">수행된 댐(performedOnDam)이 같은지 비교</text><rect x="800" y="328" width="200" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="806" y="349" font-size="18" fill="#222" text-anchor="start">authorizes 관계,</text><text x="806" y="373" font-size="18" fill="#222" text-anchor="start">위반 0건</text><text x="0" y="412" font-size="24" font-weight="bold" fill="#1f3a5f" text-anchor="start">B. 질문 경로 점검   (CQ마다 Ontology의 경로를 KG에서 실제로 따라가 보고, 답에 필요한 </text><text x="0" y="442" font-size="24" font-weight="bold" fill="#1f3a5f" text-anchor="start">개체가 나오는지 확인)</text><text x="4" y="474" font-size="19" font-weight="bold" fill="#555" text-anchor="start">CQ</text><text x="204" y="474" font-size="19" font-weight="bold" fill="#555" text-anchor="start">따라가는 경로</text><text x="544" y="474" font-size="19" font-weight="bold" fill="#555" text-anchor="start">점검 결과</text><rect x="0" y="486" width="190" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="507" font-size="18" fill="#222" text-anchor="start">CQ1 현재 상태</text><rect x="200" y="486" width="330" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="206" y="507" font-size="18" fill="#222" text-anchor="start">Dam → 상태 → 측정자료</text><rect x="540" y="486" width="460" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="546" y="507" font-size="18" fill="#222" text-anchor="start">4개 댐 모두 6개 변수 조회, 가장 최근 시각</text><text x="546" y="531" font-size="18" fill="#222" text-anchor="start">2026-09-28 23:00</text><rect x="0" y="546" width="190" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="567" font-size="18" fill="#222" text-anchor="start">CQ2 과거 상태</text><rect x="200" y="546" width="330" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="206" y="567" font-size="18" fill="#222" text-anchor="start">CQ1과 같은 경로</text><rect x="540" y="546" width="460" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="546" y="567" font-size="18" fill="#222" text-anchor="start">운영행위 68개 모두 시각의 값 조회 (정각 63개는 1행,</text><text x="546" y="591" font-size="18" fill="#222" text-anchor="start">정각이 아닌 5개는 앞뒤 정시 2행)</text><rect x="0" y="606" width="190" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="627" font-size="18" fill="#222" text-anchor="start">CQ3 과거 운영행위</text><rect x="200" y="606" width="330" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="206" y="627" font-size="18" fill="#222" text-anchor="start">Dam ← performedOnDam ←</text><text x="206" y="651" font-size="18" fill="#222" text-anchor="start">Operation</text><rect x="540" y="606" width="460" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="546" y="627" font-size="18" fill="#222" text-anchor="start">운영행위 68개 (충주 14, 소양강 5, 횡성 22, 광동 27)</text><rect x="0" y="666" width="190" height="32" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="687" font-size="18" fill="#222" text-anchor="start">CQ4 과거 방류 승인</text><rect x="200" y="666" width="330" height="32" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="206" y="687" font-size="18" fill="#222" text-anchor="start">Dam ← 승인</text><rect x="540" y="666" width="460" height="32" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="546" y="687" font-size="18" fill="#222" text-anchor="start">아래 C 참고</text><rect x="0" y="702" width="190" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="723" font-size="18" fill="#222" text-anchor="start">CQ5 현재 운영기준</text><rect x="200" y="702" width="330" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="206" y="723" font-size="18" fill="#222" text-anchor="start">Criterion → Dam, 별표3 원문</text><rect x="540" y="702" width="460" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="546" y="723" font-size="18" fill="#222" text-anchor="start">충주 138.0, 소양강 190.3, 횡성 178.2 EL.m</text><text x="546" y="747" font-size="18" fill="#222" text-anchor="start">(광동댐은 별표3에 없어 기준 없음)</text><rect x="0" y="762" width="190" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="783" font-size="18" fill="#222" text-anchor="start">CQ6 공식 근거</text><rect x="200" y="762" width="330" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="206" y="783" font-size="18" fill="#222" text-anchor="start">대상 개체 → supportedBy →</text><text x="206" y="807" font-size="18" fill="#222" text-anchor="start">EvidenceSource</text><rect x="540" y="762" width="460" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="546" y="783" font-size="18" fill="#222" text-anchor="start">승인, 운영행위, 상태, 운영기준 모두 근거자료와 연결</text><text x="0" y="846" font-size="24" font-weight="bold" fill="#1f3a5f" text-anchor="start">C. 발견한 문제와 보완</text><rect x="0" y="864" width="488" height="212" rx="6" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="8 5"/><text x="14" y="896" font-size="20" font-weight="bold" fill="#1f3a5f" text-anchor="start">보완 전</text><rect x="12" y="926" width="130" height="44" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="17" y="945" font-size="17" fill="#222" text-anchor="start">Approval</text><rect x="172" y="926" width="140" height="44" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="177" y="945" font-size="17" fill="#222" text-anchor="start">Operation</text><rect x="352" y="926" width="124" height="44" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="357" y="945" font-size="17" fill="#222" text-anchor="start">Dam</text><line x1="142" y1="948" x2="172" y2="948" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><line x1="312" y1="948" x2="352" y2="948" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><text x="100" y="910" font-size="17" fill="#222" text-anchor="middle">authorizes</text><text x="330" y="910" font-size="17" fill="#222" text-anchor="middle">performedOnDam</text><text x="14" y="1032" font-size="18" fill="#222" text-anchor="start">Operation이 없는 승인 17건(변경·연장·정정)은 댐에서</text><text x="14" y="1056" font-size="18" fill="#222" text-anchor="start">도달할 수 없다. 도달 가능한 승인 63/80건</text><rect x="512" y="864" width="488" height="212" rx="6" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="8 5"/><text x="526" y="896" font-size="20" font-weight="bold" fill="#1f3a5f" text-anchor="start">보완 후</text><rect x="524" y="926" width="130" height="44" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="529" y="945" font-size="17" fill="#222" text-anchor="start">Approval</text><rect x="684" y="926" width="140" height="44" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="689" y="945" font-size="17" fill="#222" text-anchor="start">Operation</text><rect x="864" y="926" width="124" height="44" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="869" y="945" font-size="17" fill="#222" text-anchor="start">Dam</text><line x1="654" y1="948" x2="684" y2="948" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><line x1="824" y1="948" x2="864" y2="948" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><text x="612" y="910" font-size="17" fill="#222" text-anchor="middle">authorizes</text><text x="842" y="910" font-size="17" fill="#222" text-anchor="middle">performedOnDam</text><path d="M589,972 L589,1004 L926,1004 L926,974" fill="none" stroke="#b35c00" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><text x="757" y="998" font-size="17" font-weight="bold" fill="#b35c00" text-anchor="middle" stroke="#fff" stroke-width="7" paint-order="stroke">concernsDam (추가)</text><text x="526" y="1032" font-size="18" fill="#222" text-anchor="start">관측소코드와 댐 코드의 일치로 연결(추정 없음). 도달</text><text x="526" y="1056" font-size="18" fill="#222" text-anchor="start">가능한 승인 80/80건</text><rect x="0" y="1090" width="1000" height="105" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="10" y="1118" font-size="22" fill="#222" text-anchor="start">수정된 Ontology  Class 6개(변경 없음), Relation 8개 → 9개 (Approval –concernsDam→ Dam </text><text x="10" y="1148" font-size="22" fill="#222" text-anchor="start">추가). 예) 승인 1369(횡성, 비고 “방류 시간 정정”)는 Operation이 없어 보완 전에는 댐에서</text><text x="10" y="1178" font-size="22" fill="#222" text-anchor="start">찾아지지 않았다.</text></g></svg></body></html>
