<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#44546a"/></marker><marker id="arg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2e7d32"/></marker><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78909c"/></marker></defs><rect width="1000" height="900" fill="#fff"/><g transform="translate(5,5) scale(0.99)"><text x="0" y="18" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="start">A. 구조 검사   (각 검사는 위반 목록을 세어 0건이면 통과)</text><text x="4" y="42" font-size="15" font-weight="bold" fill="#555" text-anchor="start">검사</text><text x="229" y="42" font-size="15" font-weight="bold" fill="#555" text-anchor="start">방법</text><text x="804" y="42" font-size="15" font-weight="bold" fill="#555" text-anchor="start">결과</text><rect x="0" y="52" width="215" height="49" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="71" font-size="14" fill="#222" text-anchor="start">관계의 양 끝 Class</text><rect x="225" y="52" width="565" height="49" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="233" y="71" font-size="14" fill="#222" text-anchor="start">관계 유형마다 Ontology가 허용한 (시작 Class, 끝 Class) 쌍과 비교. 예:</text><text x="233" y="90" font-size="14" fill="#222" text-anchor="start">authorizes는 Approval → Operation만 허용</text><rect x="800" y="52" width="200" height="49" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="808" y="71" font-size="14" fill="#222" text-anchor="start">모든 관계, 위반 0건</text><rect x="0" y="105" width="215" height="49" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="124" font-size="14" fill="#222" text-anchor="start">필수 Data Property</text><rect x="225" y="105" width="565" height="49" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="233" y="124" font-size="14" fill="#222" text-anchor="start">Class별 필수 속성이 개체마다 있는지 확인. 예: Operation은 operationType과</text><text x="233" y="143" font-size="14" fill="#222" text-anchor="start">operationTime</text><rect x="800" y="105" width="200" height="49" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="808" y="124" font-size="14" fill="#222" text-anchor="start">모든 개체, 위반 0건</text><rect x="0" y="158" width="215" height="49" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="177" font-size="14" fill="#222" text-anchor="start">값 형식</text><rect x="225" y="158" width="565" height="49" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="233" y="177" font-size="14" fill="#222" text-anchor="start">approvalTime은 YYYY-MM-DD, operationTime은 YYYY-MM-DDThh:mm,</text><text x="233" y="196" font-size="14" fill="#222" text-anchor="start">criterionValue는 숫자로 읽히는지 확인</text><rect x="800" y="158" width="200" height="49" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="808" y="177" font-size="14" fill="#222" text-anchor="start">Approval, Operation,</text><text x="808" y="196" font-size="14" fill="#222" text-anchor="start">Criterion, 위반 0건</text><rect x="0" y="211" width="215" height="30" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="230" font-size="14" fill="#222" text-anchor="start">근거 연결</text><rect x="225" y="211" width="565" height="30" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="233" y="230" font-size="14" fill="#222" text-anchor="start">상태, 운영행위, 승인, 운영기준 개체마다 supportedBy 관계가 1개 이상 있는지 확인</text><rect x="800" y="211" width="200" height="30" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="808" y="230" font-size="14" fill="#222" text-anchor="start">위반 0건</text><rect x="0" y="245" width="215" height="49" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="264" font-size="14" fill="#222" text-anchor="start">경로 일치</text><rect x="225" y="245" width="565" height="49" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="233" y="264" font-size="14" fill="#222" text-anchor="start">승인이 가리키는 댐(concernsDam)과 그 승인이 허가한 운영행위가 수행된</text><text x="233" y="283" font-size="14" fill="#222" text-anchor="start">댐(performedOnDam)이 같은지 비교</text><rect x="800" y="245" width="200" height="49" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="808" y="264" font-size="14" fill="#222" text-anchor="start">authorizes 관계, 위반 0건</text><text x="0" y="320" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="start">B. 질문 경로 점검   (CQ마다 Ontology의 경로를 KG에서 실제로 따라가 보고, 답에 필요한 개체가 나오는지 확인)</text><text x="4" y="344" font-size="15" font-weight="bold" fill="#555" text-anchor="start">CQ</text><text x="204" y="344" font-size="15" font-weight="bold" fill="#555" text-anchor="start">따라가는 경로</text><text x="544" y="344" font-size="15" font-weight="bold" fill="#555" text-anchor="start">점검 결과</text><rect x="0" y="354" width="190" height="30" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="373" font-size="14" fill="#222" text-anchor="start">CQ1 현재 상태</text><rect x="200" y="354" width="330" height="30" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="208" y="373" font-size="14" fill="#222" text-anchor="start">Dam → 상태 → 측정자료</text><rect x="540" y="354" width="460" height="30" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="548" y="373" font-size="14" fill="#222" text-anchor="start">4개 댐 모두 6개 변수 조회, 가장 최근 시각 2026-09-28 23:00</text><rect x="0" y="388" width="190" height="49" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="407" font-size="14" fill="#222" text-anchor="start">CQ2 과거 상태</text><rect x="200" y="388" width="330" height="49" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="208" y="407" font-size="14" fill="#222" text-anchor="start">CQ1과 같은 경로</text><rect x="540" y="388" width="460" height="49" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="548" y="407" font-size="14" fill="#222" text-anchor="start">운영행위 68개 모두 시각의 값 조회 (정각 63개는 1행, 정각이 아닌</text><text x="548" y="426" font-size="14" fill="#222" text-anchor="start">5개는 앞뒤 정시 2행)</text><rect x="0" y="441" width="190" height="30" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="460" font-size="14" fill="#222" text-anchor="start">CQ3 과거 운영행위</text><rect x="200" y="441" width="330" height="30" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="208" y="460" font-size="14" fill="#222" text-anchor="start">Dam ← performedOnDam ← Operation</text><rect x="540" y="441" width="460" height="30" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="548" y="460" font-size="14" fill="#222" text-anchor="start">운영행위 68개 (충주 14, 소양강 5, 횡성 22, 광동 27)</text><rect x="0" y="475" width="190" height="30" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="494" font-size="14" fill="#222" text-anchor="start">CQ4 과거 방류 승인</text><rect x="200" y="475" width="330" height="30" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="208" y="494" font-size="14" fill="#222" text-anchor="start">Dam ← 승인</text><rect x="540" y="475" width="460" height="30" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="548" y="494" font-size="14" fill="#222" text-anchor="start">아래 C 참고</text><rect x="0" y="509" width="190" height="49" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="528" font-size="14" fill="#222" text-anchor="start">CQ5 현재 운영기준</text><rect x="200" y="509" width="330" height="49" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="208" y="528" font-size="14" fill="#222" text-anchor="start">Criterion → Dam, 별표3 원문</text><rect x="540" y="509" width="460" height="49" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="548" y="528" font-size="14" fill="#222" text-anchor="start">충주 138.0, 소양강 190.3, 횡성 178.2 EL.m (광동댐은 별표3에 없어 </text><text x="548" y="547" font-size="14" fill="#222" text-anchor="start">기준 없음)</text><rect x="0" y="562" width="190" height="30" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="581" font-size="14" fill="#222" text-anchor="start">CQ6 공식 근거</text><rect x="200" y="562" width="330" height="30" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="208" y="581" font-size="14" fill="#222" text-anchor="start">대상 개체 → supportedBy → EvidenceSource</text><rect x="540" y="562" width="460" height="30" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="548" y="581" font-size="14" fill="#222" text-anchor="start">승인, 운영행위, 상태, 운영기준 모두 근거자료와 연결</text><text x="0" y="618" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="start">C. 발견한 문제와 보완</text><rect x="0" y="630" width="488" height="170" rx="6" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="8 5"/><text x="14" y="656" font-size="18" font-weight="bold" fill="#1f3a5f" text-anchor="start">보완 전</text><rect x="20" y="674" width="130" height="36" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="28" y="695" font-size="16" fill="#222" text-anchor="start">Approval</text><rect x="170" y="674" width="130" height="36" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="178" y="695" font-size="16" fill="#222" text-anchor="start">Operation</text><rect x="340" y="674" width="130" height="36" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="348" y="695" font-size="16" fill="#222" text-anchor="start">Dam</text><line x1="150" y1="692" x2="170" y2="692" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><line x1="300" y1="692" x2="340" y2="692" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><text x="160" y="670" font-size="12" fill="#222" text-anchor="middle">authorizes</text><text x="320" y="670" font-size="12" fill="#222" text-anchor="middle">performedOnDam</text><text x="14" y="764" font-size="15" fill="#222" text-anchor="start">Operation이 없는 승인 17건(변경·연장·정정)은 댐에서 도달할 수 </text><text x="14" y="784" font-size="15" fill="#222" text-anchor="start">없다. CQ4에서 도달 가능한 승인 63/80건</text><rect x="512" y="630" width="488" height="170" rx="6" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="8 5"/><text x="526" y="656" font-size="18" font-weight="bold" fill="#1f3a5f" text-anchor="start">보완 후</text><rect x="532" y="674" width="130" height="36" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="540" y="695" font-size="16" fill="#222" text-anchor="start">Approval</text><rect x="682" y="674" width="130" height="36" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="690" y="695" font-size="16" fill="#222" text-anchor="start">Operation</text><rect x="852" y="674" width="130" height="36" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="860" y="695" font-size="16" fill="#222" text-anchor="start">Dam</text><line x1="662" y1="692" x2="682" y2="692" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><line x1="812" y1="692" x2="852" y2="692" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><text x="672" y="670" font-size="12" fill="#222" text-anchor="middle">authorizes</text><text x="832" y="670" font-size="12" fill="#222" text-anchor="middle">performedOnDam</text><path d="M597,710 L597,738 L917,738 L917,712" fill="none" stroke="#b35c00" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><text x="757" y="732" font-size="13" font-weight="bold" fill="#b35c00" text-anchor="middle" stroke="#fff" stroke-width="7" paint-order="stroke">concernsDam (추가)</text><text x="526" y="764" font-size="15" fill="#222" text-anchor="start">승인 기록의 관측소코드와 댐 코드의 일치로 연결(추정 없음). 도달 </text><text x="526" y="784" font-size="15" fill="#222" text-anchor="start">가능한 승인 80/80건</text><rect x="0" y="814" width="1000" height="65" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="12" y="840" font-size="17" fill="#222" text-anchor="start">수정된 Ontology  Class 6개(변경 없음), Relation 8개 → 9개 (Approval –concernsDam→ Dam 추가). 예) 승인 1369(횡성,</text><text x="12" y="864" font-size="17" fill="#222" text-anchor="start">비고 “방류 시간 정정”)는 Operation이 없어 보완 전에는 댐에서 찾아지지 않았다.</text></g></svg></body></html>
