<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="821" viewBox="0 0 1000 821"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#44546a"/></marker><marker id="arg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2e7d32"/></marker><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78909c"/></marker></defs><rect width="1000" height="821" fill="#fff"/><g transform="translate(5,5) scale(0.99)"><text x="0" y="20" font-size="24" font-weight="bold" fill="#1f3a5f" text-anchor="start">의도(CQ)마다 따라가는 경로와 가져오는 근거</text><text x="4" y="52" font-size="19" font-weight="bold" fill="#555" text-anchor="start">의도</text><text x="209" y="52" font-size="19" font-weight="bold" fill="#555" text-anchor="start">따라가는 경로 (Ontology)</text><text x="674" y="52" font-size="19" font-weight="bold" fill="#555" text-anchor="start">가져오는 근거</text><rect x="0" y="64" width="190" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="85" font-size="18" fill="#222" text-anchor="start">CQ1 현재 상태</text><rect x="205" y="64" width="450" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="211" y="85" font-size="18" fill="#222" text-anchor="start">Dam → hasHydrometeorologicalState → 상태 →</text><text x="211" y="109" font-size="18" fill="#222" text-anchor="start">stationCode로 측정자료 조회</text><rect x="670" y="64" width="330" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="676" y="85" font-size="18" fill="#222" text-anchor="start">저장된 가장 최근 시각의 6개 변수</text><rect x="0" y="124" width="190" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="145" font-size="18" fill="#222" text-anchor="start">CQ2 과거 상태</text><rect x="205" y="124" width="450" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="211" y="145" font-size="18" fill="#222" text-anchor="start">CQ1과 같은 경로, 시점을 지정</text><rect x="670" y="124" width="330" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="676" y="145" font-size="18" fill="#222" text-anchor="start">지정한 시점의 6개 변수. 운영행위와 </text><text x="676" y="169" font-size="18" fill="#222" text-anchor="start">함께 물으면 그 운영행위 시각의 값</text><rect x="0" y="184" width="190" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="205" font-size="18" fill="#222" text-anchor="start">CQ3 과거 운영행위</text><rect x="205" y="184" width="450" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="211" y="205" font-size="18" fill="#222" text-anchor="start">Dam ← performedOnDam ← Operation (←</text><text x="211" y="229" font-size="18" fill="#222" text-anchor="start">authorizes ← Approval)</text><rect x="670" y="184" width="330" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="676" y="205" font-size="18" fill="#222" text-anchor="start">운영행위(종류, 시각)와 그것을 허가한 </text><text x="676" y="229" font-size="18" fill="#222" text-anchor="start">승인</text><rect x="0" y="244" width="190" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="265" font-size="18" fill="#222" text-anchor="start">CQ4 과거 방류 승인</text><rect x="205" y="244" width="450" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="211" y="265" font-size="18" fill="#222" text-anchor="start">Dam ← concernsDam ← Approval</text><rect x="670" y="244" width="330" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="676" y="265" font-size="18" fill="#222" text-anchor="start">승인(승인일, 방류시작, 접수방류량, </text><text x="676" y="289" font-size="18" fill="#222" text-anchor="start">비고)</text><rect x="0" y="304" width="190" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="325" font-size="18" fill="#222" text-anchor="start">CQ5 현재 운영기준</text><rect x="205" y="304" width="450" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="211" y="325" font-size="18" fill="#222" text-anchor="start">Criterion → appliesToDam → Dam,</text><text x="211" y="349" font-size="18" fill="#222" text-anchor="start">sourceLocator로 문서 조회</text><rect x="670" y="304" width="330" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="676" y="325" font-size="18" fill="#222" text-anchor="start">제한수위와 근거(별표3 원문)</text><rect x="0" y="364" width="190" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="385" font-size="18" fill="#222" text-anchor="start">CQ6 공식 근거</text><rect x="205" y="364" width="450" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="211" y="385" font-size="18" fill="#222" text-anchor="start">대상 개체 → supportedBy → EvidenceSource</text><rect x="670" y="364" width="330" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="676" y="385" font-size="18" fill="#222" text-anchor="start">출처와 위치(승인 레코드, 측정자료,</text><text x="676" y="409" font-size="18" fill="#222" text-anchor="start">별표3)</text><rect x="0" y="428" width="1000" height="61" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="8" y="451" font-size="18" fill="#222" text-anchor="start">시점: CQ2~CQ4는 하루, 기간, 전체 기간 중 하나 (없으면 전체).   현재: 실시간이 아니라 저장된 가장 최근</text><text x="8" y="475" font-size="18" fill="#222" text-anchor="start">시각(2026-09-28 23:00).   여러 의도: 의도마다 근거를 가져와 하나의 근거 묶음으로 합친다.</text><text x="0" y="518" font-size="24" font-weight="bold" fill="#1f3a5f" text-anchor="start">예시 질문 → LLM이 뽑은 의도 → 규칙이 가져온 근거 (충주댐, 실제 실행 결과)</text><text x="4" y="550" font-size="19" font-weight="bold" fill="#555" text-anchor="start">질문의 부분</text><text x="354" y="550" font-size="19" font-weight="bold" fill="#555" text-anchor="start">LLM이 뽑은 의도</text><text x="504" y="550" font-size="19" font-weight="bold" fill="#555" text-anchor="start">규칙이 가져온 근거</text><rect x="0" y="562" width="330" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="583" font-size="18" fill="#222" text-anchor="start">현재 수문, 기상 데이터</text><rect x="350" y="562" width="130" height="56" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="356" y="583" font-size="18" fill="#222" text-anchor="start">CQ1</text><rect x="500" y="562" width="500" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="506" y="583" font-size="18" fill="#222" text-anchor="start">최근 시각(2026-09-28 23:00)의 수위, 저수량, 강우량,</text><text x="506" y="607" font-size="18" fill="#222" text-anchor="start">유입량, 총방류량, 저수율</text><rect x="0" y="622" width="330" height="32" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="643" font-size="18" fill="#222" text-anchor="start">제한수위</text><rect x="350" y="622" width="130" height="32" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="356" y="643" font-size="18" fill="#222" text-anchor="start">CQ5</text><rect x="500" y="622" width="500" height="32" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="506" y="643" font-size="18" fill="#222" text-anchor="start">홍수기 제한수위 138.0 EL.m와 별표3 원문</text><rect x="0" y="658" width="330" height="32" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="679" font-size="18" fill="#222" text-anchor="start">비슷한 수문상태일 때의 운영 행위</text><rect x="350" y="658" width="130" height="32" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="356" y="679" font-size="18" fill="#222" text-anchor="start">CQ3</text><rect x="500" y="658" width="500" height="32" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="506" y="679" font-size="18" fill="#222" text-anchor="start">충주댐의 운영행위 14개 (종류, 시각)와 그것을 허가한 승인</text><rect x="0" y="694" width="330" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="715" font-size="18" fill="#222" text-anchor="start">비슷한 수문상태일 때의 승인</text><rect x="350" y="694" width="130" height="56" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="356" y="715" font-size="18" fill="#222" text-anchor="start">CQ4</text><rect x="500" y="694" width="500" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="506" y="715" font-size="18" fill="#222" text-anchor="start">충주댐의 방류 승인 15건 (승인일, 방류시작, 접수방류량, </text><text x="506" y="739" font-size="18" fill="#222" text-anchor="start">비고)</text><rect x="0" y="754" width="330" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="775" font-size="18" fill="#222" text-anchor="start">그때의 수문상태</text><rect x="350" y="754" width="130" height="56" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="356" y="775" font-size="18" fill="#222" text-anchor="start">뽑히지 않음</text><rect x="500" y="754" width="500" height="56" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="506" y="775" font-size="18" fill="#222" text-anchor="start">운영행위 시각의 상태(CQ2)는 이번 실행에서 뽑히지 않아</text><text x="506" y="799" font-size="18" fill="#222" text-anchor="start">가져오지 못했다 (5번 실행 중 1번만 포함, 3.9절 한계 2)</text></g></svg></body></html>
