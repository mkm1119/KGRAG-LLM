<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="656" viewBox="0 0 1000 656"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#44546a"/></marker><marker id="arg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2e7d32"/></marker><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78909c"/></marker></defs><rect width="1000" height="656" fill="#fff"/><g transform="translate(5,5) scale(0.99)"><text x="0" y="18" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="start">의도(CQ)마다 따라가는 경로와 가져오는 근거</text><text x="4" y="42" font-size="15" font-weight="bold" fill="#555" text-anchor="start">의도</text><text x="209" y="42" font-size="15" font-weight="bold" fill="#555" text-anchor="start">따라가는 경로 (Ontology)</text><text x="674" y="42" font-size="15" font-weight="bold" fill="#555" text-anchor="start">가져오는 근거</text><rect x="0" y="52" width="190" height="49" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="71" font-size="14" fill="#222" text-anchor="start">CQ1 현재 상태</text><rect x="205" y="52" width="450" height="49" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="213" y="71" font-size="14" fill="#222" text-anchor="start">Dam → hasHydrometeorologicalState → 상태 → stationCode로 </text><text x="213" y="90" font-size="14" fill="#222" text-anchor="start">측정자료 조회</text><rect x="670" y="52" width="330" height="49" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="678" y="71" font-size="14" fill="#222" text-anchor="start">저장된 가장 최근 시각의 6개 변수</text><rect x="0" y="105" width="190" height="49" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="124" font-size="14" fill="#222" text-anchor="start">CQ2 과거 상태</text><rect x="205" y="105" width="450" height="49" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="213" y="124" font-size="14" fill="#222" text-anchor="start">CQ1과 같은 경로, 시점을 지정</text><rect x="670" y="105" width="330" height="49" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="678" y="124" font-size="14" fill="#222" text-anchor="start">지정한 시점의 6개 변수. 운영행위와 함께 물으면 </text><text x="678" y="143" font-size="14" fill="#222" text-anchor="start">그 운영행위 시각의 값</text><rect x="0" y="158" width="190" height="49" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="177" font-size="14" fill="#222" text-anchor="start">CQ3 과거 운영행위</text><rect x="205" y="158" width="450" height="49" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="213" y="177" font-size="14" fill="#222" text-anchor="start">Dam ← performedOnDam ← Operation (← authorizes ←</text><text x="213" y="196" font-size="14" fill="#222" text-anchor="start">Approval)</text><rect x="670" y="158" width="330" height="49" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="678" y="177" font-size="14" fill="#222" text-anchor="start">운영행위(종류, 시각)와 그것을 허가한 승인</text><rect x="0" y="211" width="190" height="30" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="230" font-size="14" fill="#222" text-anchor="start">CQ4 과거 방류 승인</text><rect x="205" y="211" width="450" height="30" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="213" y="230" font-size="14" fill="#222" text-anchor="start">Dam ← concernsDam ← Approval</text><rect x="670" y="211" width="330" height="30" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="678" y="230" font-size="14" fill="#222" text-anchor="start">승인(승인일, 방류시작, 접수방류량, 비고)</text><rect x="0" y="245" width="190" height="30" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="264" font-size="14" fill="#222" text-anchor="start">CQ5 현재 운영기준</text><rect x="205" y="245" width="450" height="30" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="213" y="264" font-size="14" fill="#222" text-anchor="start">Criterion → appliesToDam → Dam, sourceLocator로 문서 조회</text><rect x="670" y="245" width="330" height="30" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="678" y="264" font-size="14" fill="#222" text-anchor="start">제한수위와 근거(별표3 원문)</text><rect x="0" y="279" width="190" height="30" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="298" font-size="14" fill="#222" text-anchor="start">CQ6 공식 근거</text><rect x="205" y="279" width="450" height="30" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="213" y="298" font-size="14" fill="#222" text-anchor="start">대상 개체 → supportedBy → EvidenceSource</text><rect x="670" y="279" width="330" height="30" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="678" y="298" font-size="14" fill="#222" text-anchor="start">출처와 위치(승인 레코드, 측정자료, 별표3)</text><rect x="0" y="317" width="1000" height="53" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="10" y="338" font-size="14" fill="#222" text-anchor="start">시점: CQ2~CQ4는 하루, 기간, 전체 기간 중 하나 (없으면 전체).   현재: 실시간이 아니라 저장된 가장 최근 시각(2026-09-28 23:00).   여러 의도: 의도마다 </text><text x="10" y="357" font-size="14" fill="#222" text-anchor="start">근거를 가져와 하나의 근거 묶음으로 합친다.</text><text x="0" y="405" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="start">예시 질문 → LLM이 뽑은 의도 → 규칙이 가져온 근거 (충주댐, 실제 실행 결과)</text><text x="4" y="429" font-size="15" font-weight="bold" fill="#555" text-anchor="start">질문의 부분</text><text x="354" y="429" font-size="15" font-weight="bold" fill="#555" text-anchor="start">LLM이 뽑은 의도</text><text x="504" y="429" font-size="15" font-weight="bold" fill="#555" text-anchor="start">규칙이 가져온 근거</text><rect x="0" y="439" width="330" height="49" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="458" font-size="14" fill="#222" text-anchor="start">현재 수문, 기상 데이터</text><rect x="350" y="439" width="130" height="49" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="358" y="458" font-size="14" fill="#222" text-anchor="start">CQ1</text><rect x="500" y="439" width="500" height="49" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="508" y="458" font-size="14" fill="#222" text-anchor="start">최근 시각(2026-09-28 23:00)의 수위, 저수량, 강우량, 유입량, 총방류량,</text><text x="508" y="477" font-size="14" fill="#222" text-anchor="start">저수율</text><rect x="0" y="492" width="330" height="30" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="511" font-size="14" fill="#222" text-anchor="start">제한수위</text><rect x="350" y="492" width="130" height="30" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="358" y="511" font-size="14" fill="#222" text-anchor="start">CQ5</text><rect x="500" y="492" width="500" height="30" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="508" y="511" font-size="14" fill="#222" text-anchor="start">홍수기 제한수위 138.0 EL.m와 별표3 원문</text><rect x="0" y="526" width="330" height="30" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="545" font-size="14" fill="#222" text-anchor="start">비슷한 수문상태일 때의 운영 행위</text><rect x="350" y="526" width="130" height="30" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="358" y="545" font-size="14" fill="#222" text-anchor="start">CQ3</text><rect x="500" y="526" width="500" height="30" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="508" y="545" font-size="14" fill="#222" text-anchor="start">충주댐의 운영행위 14개 (종류, 시각)와 그것을 허가한 승인</text><rect x="0" y="560" width="330" height="30" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="579" font-size="14" fill="#222" text-anchor="start">비슷한 수문상태일 때의 승인</text><rect x="350" y="560" width="130" height="30" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="358" y="579" font-size="14" fill="#222" text-anchor="start">CQ4</text><rect x="500" y="560" width="500" height="30" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="508" y="579" font-size="14" fill="#222" text-anchor="start">충주댐의 방류 승인 15건 (승인일, 방류시작, 접수방류량, 비고)</text><rect x="0" y="594" width="330" height="49" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="613" font-size="14" fill="#222" text-anchor="start">그때의 수문상태</text><rect x="350" y="594" width="130" height="49" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="358" y="613" font-size="14" fill="#222" text-anchor="start">뽑히지 않음</text><rect x="500" y="594" width="500" height="49" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="508" y="613" font-size="14" fill="#222" text-anchor="start">운영행위 시각의 상태(CQ2)는 이번 실행에서 뽑히지 않아 가져오지 못했다</text><text x="508" y="632" font-size="14" fill="#222" text-anchor="start">(5번 실행 중 1번만 포함, 3.8절 한계 2)</text></g></svg></body></html>
