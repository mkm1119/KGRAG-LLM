<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="545" viewBox="0 0 1000 545"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#44546a"/></marker><marker id="arg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2e7d32"/></marker><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78909c"/></marker></defs><rect width="1000" height="545" fill="#fff"/><g transform="translate(5,5) scale(0.99)"><text x="4" y="20" font-size="20" font-weight="bold" fill="#555" text-anchor="start">단계</text><text x="254" y="20" font-size="20" font-weight="bold" fill="#555" text-anchor="start">구분</text><text x="404" y="20" font-size="20" font-weight="bold" fill="#555" text-anchor="start">입력 → 출력</text><rect x="0" y="32" width="230" height="39" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="57" font-size="20" fill="#222" text-anchor="start">질문 해석</text><line x1="231" y1="51" x2="248" y2="51" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="250" y="32" width="130" height="39" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="258" y="57" font-size="20" fill="#222" text-anchor="start">LLM</text><line x1="381" y1="51" x2="398" y2="51" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="400" y="32" width="600" height="39" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="408" y="57" font-size="20" fill="#222" text-anchor="start">질문 → 의도와 값(댐, 시점)</text><rect x="0" y="77" width="230" height="39" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="102" font-size="20" fill="#222" text-anchor="start">1 입력 확인</text><line x1="231" y1="96" x2="248" y2="96" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="250" y="77" width="130" height="39" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="258" y="102" font-size="20" fill="#222" text-anchor="start">자동화</text><line x1="381" y1="96" x2="398" y2="96" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="400" y="77" width="600" height="39" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="408" y="102" font-size="20" fill="#222" text-anchor="start">의도와 값 → 확인된 의도와 값 (벗어나면 “범위 밖”)</text><rect x="0" y="122" width="230" height="39" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="147" font-size="20" fill="#222" text-anchor="start">2 KG 조회</text><line x1="231" y1="141" x2="248" y2="141" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="250" y="122" width="130" height="39" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="258" y="147" font-size="20" fill="#222" text-anchor="start">자동화</text><line x1="381" y1="141" x2="398" y2="141" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="400" y="122" width="600" height="39" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="408" y="147" font-size="20" fill="#222" text-anchor="start">의도와 값 → 관련 개체와 찾아가는 키</text><rect x="0" y="167" width="230" height="39" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="192" font-size="20" fill="#222" text-anchor="start">3 외부 저장소 조회</text><line x1="231" y1="186" x2="248" y2="186" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="250" y="167" width="130" height="39" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="258" y="192" font-size="20" fill="#222" text-anchor="start">자동화</text><line x1="381" y1="186" x2="398" y2="186" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="400" y="167" width="600" height="39" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="408" y="192" font-size="20" fill="#222" text-anchor="start">키 → 측정값, 규정 원문</text><rect x="0" y="212" width="230" height="39" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="237" font-size="20" fill="#222" text-anchor="start">4 근거 묶음 구성</text><line x1="231" y1="231" x2="248" y2="231" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="250" y="212" width="130" height="39" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="258" y="237" font-size="20" fill="#222" text-anchor="start">자동화</text><line x1="381" y1="231" x2="398" y2="231" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="400" y="212" width="600" height="39" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="408" y="237" font-size="20" fill="#222" text-anchor="start">찾은 근거 → 출처 번호가 붙은 근거 묶음</text><rect x="0" y="257" width="230" height="39" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="282" font-size="20" fill="#222" text-anchor="start">답변 생성</text><line x1="231" y1="276" x2="248" y2="276" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="250" y="257" width="130" height="39" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="258" y="282" font-size="20" fill="#222" text-anchor="start">LLM</text><line x1="381" y1="276" x2="398" y2="276" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="400" y="257" width="600" height="39" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="408" y="282" font-size="20" fill="#222" text-anchor="start">질문 + 근거 묶음 → 답변</text><rect x="0" y="312" width="485" height="71" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="10" y="339" font-size="20" fill="#222" text-anchor="start">LLM → 자동화</text><text x="10" y="367" font-size="20" fill="#222" text-anchor="start">의도(여러 개 가능)와 값</text><rect x="515" y="312" width="485" height="71" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="525" y="339" font-size="20" fill="#222" text-anchor="start">자동화 → LLM</text><text x="525" y="367" font-size="20" fill="#222" text-anchor="start">근거 묶음과 질문, 그리고 근거 사용 원칙 세 문장</text><rect x="0" y="393" width="1000" height="120" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="10" y="419" font-size="19" fill="#222" text-anchor="start">근거 사용 원칙</text><text x="10" y="445" font-size="19" fill="#222" text-anchor="start">(1) 주어진 근거만 사실로 사용하고, 사실마다 출처 번호를 붙인다.</text><text x="10" y="471" font-size="19" fill="#222" text-anchor="start">(2) 근거를 해석하거나 비교한 내용은 LLM의 판단임을 밝히고, 어떤 근거에서 나온 판단인지 함께 적는다.</text><text x="10" y="497" font-size="19" fill="#222" text-anchor="start">(3) 근거에 없는 내용은 “자료에 없음”이라고 답한다.</text></g></svg></body></html>
