<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="879" viewBox="0 0 1000 879"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#44546a"/></marker><marker id="arg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2e7d32"/></marker><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78909c"/></marker></defs><rect width="1000" height="879" fill="#fff"/><g transform="translate(5,5) scale(0.99)"><rect x="0" y="0" width="1000" height="85" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="23" font-size="18" fill="#222" text-anchor="start">[질문] 충주댐 현재 수문, 기상 데이터를 가져오고 제한수위와 비교한 후에, 이와 비슷한 수문상태일 때의 승인 및 운영</text><text x="8" y="47" font-size="18" fill="#222" text-anchor="start">행위가 있었으면 알려줘.</text><text x="8" y="71" font-size="18" fill="#222" text-anchor="start">[대상] 충주댐, 기간 전체</text><text x="0" y="113" font-size="22" font-weight="bold" fill="#1f3a5f" text-anchor="start">근거 1. 현재 상태 (CQ1)</text><text x="1000" y="113" font-size="18" fill="#555" text-anchor="end">측정자료 저장소</text><rect x="0" y="121" width="250" height="78" rx="6" fill="#fff3e6" stroke="#e08a1e" stroke-width="2"/><text x="10" y="165" font-size="17" font-weight="bold" fill="#222" text-anchor="start">[MEA:1003110:2026092823]</text><rect x="270" y="121" width="730" height="78" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="276" y="142" font-size="18" fill="#222" text-anchor="start">2026-09-28 23:00  수위 131.6689 EL.m, 저수량 1491.3423 MCM, 강우량 0 mm,</text><text x="276" y="166" font-size="18" fill="#222" text-anchor="start">유입량 14.402 CMS, 총방류량 0.43 CMS, 저수율 54.2 %  (저장된 가장 최근 시각이며 </text><text x="276" y="190" font-size="18" fill="#222" text-anchor="start">실시간이 아님)</text><line x1="251" y1="160" x2="269" y2="160" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><text x="0" y="229" font-size="22" font-weight="bold" fill="#1f3a5f" text-anchor="start">근거 2. 운영기준 (CQ5)</text><text x="1000" y="229" font-size="18" fill="#555" text-anchor="end">KG + 문서 저장소</text><rect x="0" y="237" width="250" height="38" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="10" y="261" font-size="17" font-weight="bold" fill="#222" text-anchor="start">[CRI:CR-02]</text><rect x="270" y="237" width="730" height="38" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="276" y="258" font-size="18" fill="#222" text-anchor="start">충주댐 홍수기 제한수위: 138.0 EL.m</text><line x1="251" y1="256" x2="269" y2="256" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="0" y="281" width="250" height="58" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="10" y="315" font-size="17" font-weight="bold" fill="#222" text-anchor="start">[EVI:LAW:별표3]</text><rect x="270" y="281" width="730" height="58" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="276" y="302" font-size="18" fill="#222" text-anchor="start">댐과 보 등의 연계운영규정 (기후에너지환경부 훈령 제42호, 시행 2026-07-08) 원문</text><text x="276" y="326" font-size="18" fill="#222" text-anchor="start">(별표3 원문 전체)</text><line x1="251" y1="310" x2="269" y2="310" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><text x="0" y="369" font-size="22" font-weight="bold" fill="#1f3a5f" text-anchor="start">근거 3. 운영행위와 허가한 승인 (CQ3)</text><text x="1000" y="369" font-size="18" fill="#555" text-anchor="end">KG</text><rect x="0" y="377" width="250" height="38" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="10" y="401" font-size="1 ="276" y="584" font-size="18" fill="#222" text-anchor="start">승인일 2010-09-22: 방류시작 2010-09-22 15:00; 접수방류량 2000㎥/s</text><line x1="251" y1="582" x2="269" y2="582" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="0" y="607" width="250" height="58" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="10" y="641" font-size="17" font-weight="bold" fill="#222" text-anchor="start">[APR:504]</text><rect x="270" y="607" width="730" height="58" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="276" y="628" font-size="18" fill="#222" text-anchor="start">승인일 2011-06-27: 방류시작 2011-06-27 18:00; 접수방류량 2000㎥/s; 비고:</text><text x="276" y="652" font-size="18" fill="#222" text-anchor="start">(실제방류는 20시부터)</text><line x1="251" y1="636" x2="269" y2="636" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="0" y="671" width="250" height="58" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="10" y="705" font-size="17" font-weight="bold" fill="#222" text-anchor="start">[APR:574]</text><rect x="270" y="671" width="730" height="58" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="276" y="692" font-size="18" fill="#222" text-anchor="start">승인일 2011-07-01: 방류시작 2011-07-01 18:00; 접수방류량 2000㎥/s; 비고: (실제 </text><text x="276" y="716" font-size="18" fill="#222" text-anchor="start">방류는 19시부터)</text><line x1="251" y1="700" x2="269" y2="700" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><text x="270" y="749" font-size="19" fill="#777" text-anchor="start">… (승인 15건 중 3건만 표시)</text><rect x="0" y="763" width="1000" height="109" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="8" y="786" font-size="18" fill="#222" text-anchor="start">근거 사용 원칙</text><text x="8" y="810" font-size="18" fill="#222" text-anchor="start">1. 위 근거에 있는 내용만 사실로 쓰고, 문장마다 출처 번호를 붙인다.</text><text x="8" y="834" font-size="18" fill="#222" text-anchor="start">2. 비교나 해석은 LLM의 판단임을 밝히고, 어느 근거에서 나온 판단인지 적는다.</text><text x="8" y="858" font-size="18" fill="#222" text-anchor="start">3. 근거에 없는 내용은 “자료에 없음”이라고 답한다.</text></g></svg></body></html>
