text><rect x="620" y="180" width="380" height="29" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="627" y="199" font-size="15" fill="#222" text-anchor="start">만든 자료의 순차번호, 댐 코드</text><text x="0" y="236" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="start">관계마다 일치시키는 값과 만들어지는 개수</text><text x="4" y="260" font-size="15" font-weight="bold" fill="#555" text-anchor="start">관계</text><text x="269" y="260" font-size="15" font-weight="bold" fill="#555" text-anchor="start">연결하는 개체 쌍</text><text x="464" y="260" font-size="15" font-weight="bold" fill="#555" text-anchor="start">일치시키는 값</text><text x="939" y="260" font-size="15" font-weight="bold" fill="#555" text-anchor="start">개수</text><rect x="0" y="270" width="255" height="68" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="289" font-size="14" fill="#222" text-anchor="start">Approval –concernsDam→ Dam</text><rect x="265" y="270" width="185" height="68" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="273" y="289" font-size="14" fill="#222" text-anchor="start">승인 한 건과 그 승인이</text><text x="273" y="308" font-size="14" fill="#222" text-anchor="start">다루는 댐</text><rect x="460" y="270" width="465" height="68" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="468" y="289" font-size="14" fill="#222" text-anchor="start">승인 기록의 관측소코드 = 댐 정보의 댐 코드 (1003110 = 1003110). </text><text x="468" y="308" font-size="14" fill="#222" text-anchor="start">이름도 같다(관측소명 “충주” = 댐 이름 “충주댐”에서 “댐”을 뺀 </text><text x="468" y="327" font-size="14" fill="#222" text-anchor="start">것). 4개 댐 모두 해당</text><rect x="935" y="270" width="65" height="68" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="943" y="289" font-size="14" fill="#222" text-anchor="start">80</text><rect x="0" y="342" width="255" height="49" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="361" font-size="14" fill="#222" text-anchor="start">Approval –authorizes→ Operation</text><rect x="265" y="342" width="185" height="49" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="273" y="361" font-size="14" fill="#222" text-anchor="start">승인 한 건과 그 비고에서 </text><text x="273" y="380" font-size="14" fill="#222" text-anchor="start">읽어 만든 운영행위</text><rect x="460" y="342" width="465" height="49" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="468" y="361" font-size="14" fill="#222" text-anchor="start">승인의 순차번호 = 운영행위 ID의 승인 순차번호 (APR:1368 →</text><text x="468" y="380" font-size="14" fill="#222" text-anchor="start">OPR:1368:1). 같은 승인 레코드에서 만든 개체</text><rect x="935" y="342" width="65" height="49" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="943" y="361" font-size="14" fill="#222" text-anchor="start">68</text><rect x="0" y="395" width="255" height="49" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="414" font-size="14" fill="#222" text-anchor="start">Operation –performedOnDam→ Dam</text><rect x="265" y="395" width="185" height="49" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="273" y="414" font-size="14" fill="#222" text-anchor="start">운영행위와 수행된 댐</text><rect x="460" y="395" width="465" height="49" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="468" y="414" font-size="14" fill="#222" text-anchor="start">운영행위를 만든 승인의 관측소코드 = 댐 코드 (승인 → 댐 연결과 같은 </text><text x="468" y="433" font-size="14" fill="#222" text-anchor="start">코드)</text><rect x="935" y="395" width="65" height="49" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="943" y="414" font-size="14" fill="#222" text-anchor="start">68</text><rect x="0" y="448" width="255" height="49" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="467" font-size="14" fill="#222" text-anchor="start">Dam –hasHydrometeorologicalStat</text><text x="8" y="486" font-size="14" fill="#222" text-anchor="start">e→ HMS</text><rect x="265" y="448" width="185" height="49" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="273" y="467" font-size="14" fill="#222" text-anchor="start">댐과 그 댐의 변수별 상태</text><rect x="460" y="448" width="465" height="49" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="468" y="467" font-size="14" fill="#222" text-anchor="start">댐 정보의 댐 코드 = 시간 자료의 댐 코드 (같은 기관의 같은 코드 체계)</text><rect x="935" y="448" width="65" height="49" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="943" y="467" font-size="14" fill="#222" text-anchor="start">24</text><rect x="0" y="501" width="255" height="49" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="520" font-size="14" fill="#222" text-anchor="start">Criterion –appliesToDam→ Dam</text><rect x="265" y="501" width="185" height="49" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="273" y="520" font-size="14" fill="#222" text-anchor="start">제한수위와 적용 댐</text><rect x="460" y="501" width="465" height="49" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="468" y="520" font-size="14" fill="#222" text-anchor="start">별표3의 댐 이름(공백 제거) = 댐 정보의 댐 이름. 별표3에는 코드가</text><text x="468" y="539" font-size="14" fill="#222" text-anchor="start">없어 이름이 같다는 것으로 연결</text><rect x="935" y="501" width="65" height="49" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="943" y="520" font-size="14" fill="#222" text-anchor="start">3</text><rect x="0" y="554" width="255" height="68" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="573" font-size="14" fill="#222" text-anchor="start">Approval, Operation, HMS,</text><text x="8" y="592" font-size="14" fill="#222" text-anchor="start">Criterion –supportedBy→</text><text x="8" y="611" font-size="14" fill="#222" text-anchor="start">EvidenceSource</text><rect x="265" y="554" width="185" height="68" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="273" y="573" font-size="14" fill="#222" text-anchor="start">개체와 그것을 만든 자료의</text><text x="273" y="592" font-size="14" fill="#222" text-anchor="start">근거자료</text><rect x="460" y="554" width="465" height="68" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="468" y="573" font-size="14" fill="#222" text-anchor="start">만든 자료가 곧 근거: 승인 → 같은 순차번호의 승인 레코드, Operation</text><text x="468" y="592" font-size="14" fill="#222" text-anchor="start">→ 만든 승인의 순차번호, 상태 → 같은 댐 코드의 측정자료, Criterion</text><text x="468" y="611" font-size="14" fill="#222" text-anchor="start">→ 별표3</text><rect x="935" y="554" width="65" height="68" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="943" y="573" font-size="14" fill="#222" text-anchor="start">175</text><text x="0" y="650" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="start">연결에 쓰는 값의 대응</text><rect x="0" y="662" width="492" height="140" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="10" y="684" font-size="15" fill="#222" text-anchor="start">① 승인 관측소코드 ↔ 댐 코드 (한강홍수통제소 승인 파일과 K-water </text><text x="10" y="705" font-size="15" fill="#222" text-anchor="start">댐 정보)</text><text x="10" y="726" font-size="15" fill="#222" text-anchor="start">1003110, 충주 ↔ 1003110, 충주댐</text><text x="10" y="747" font-size="15" fill="#222" text-anchor="start">1012110, 소양강 ↔ 1012110, 소양강댐</text><text x="10" y="768" font-size="15" fill="#222" text-anchor="start">1006110, 횡성 ↔ 1006110, 횡성댐</text><text x="10" y="789" font-size="15" fill="#222" text-anchor="start">1001210, 광동 ↔ 1001210, 광동댐</text><rect x="508" y="662" width="492" height="140" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="518" y="684" font-size="15" fill="#222" text-anchor="start">② 별표3 댐 이름 ↔ 댐 이름 (별표3에는 코드가 없다)</text><text x="518" y="705" font-size="15" fill="#222" text-anchor="start">충 주 댐 → 충주댐 ↔ 충주댐</text><text x="518" y="726" font-size="15" fill="#222" text-anchor="start">소양강댐 → 소양강댐 ↔ 소양강댐</text><text x="518" y="747" font-size="15" fill="#222" text-anchor="start">횡 성 댐 → 횡성댐 ↔ 횡성댐</text><text x="518" y="768" font-size="15" fill="#222" text-anchor="start">(광동댐 없음) → 이 관계 없음</text><rect x="0" y="814" width="1000" height="41" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="12" y="840" font-size="17" fill="#222" text-anchor="start">결과  관계 418개. 변경·연장·정정 승인과 원 승인을 잇는 관계는 자료에 연결 근거가 없어 만들지 않는다.</text></g></svg></body></html>
