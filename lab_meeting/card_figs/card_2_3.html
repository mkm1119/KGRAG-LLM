ont-size="18" fill="#222" text-anchor="start">200</text><text x="14" y="454" font-size="18" fill="#b3261e" text-anchor="start">2220 (제거)</text><text x="130" y="454" font-size="18" fill="#b3261e" text-anchor="start">광동</text><text x="205" y="454" font-size="17" fill="#b3261e" text-anchor="start">2016-07-04 18:00</text><text x="390" y="454" font-size="18" fill="#b3261e" text-anchor="start">200</text><text x="14" y="478" font-size="18" fill="#444" text-anchor="start">순차번호만 다르고 값이 모두 같아 2220을 제거한다</text><rect x="512" y="326" width="488" height="190" rx="6" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="8 5"/><text x="526" y="356" font-size="20" font-weight="bold" fill="#1f3a5f" text-anchor="start">예시 ② 시각 라벨 (24시 표기)</text><text x="526" y="396" font-size="18" fill="#222" text-anchor="start">2012082416  →  2012-08-24 16:00</text><text x="526" y="428" font-size="18" fill="#b3261e" text-anchor="start">2016062924  →  2016-06-30 00:00</text><text x="526" y="462" font-size="17" fill="#444" text-anchor="start">라벨 = 날짜 8자리 + 시각 2자리(01~24)</text><text x="526" y="487" font-size="17" fill="#444" text-anchor="start">24시는 그날의 끝이므로 다음날 0시로 읽는다</text><rect x="0" y="528" width="1000" height="61" rx="6" fill="#fff3e6" stroke="#e08a1e" stroke-width="2" stroke-dasharray="8 5"/><text x="8" y="551" font-size="18" fill="#222" text-anchor="start">확인 필요  시각 라벨 01~24가 “그 시각 직전 한 시간의 값”인지 “그 시각 정각의 값”인지 K-water 자료 설명에서</text><text x="8" y="575" font-size="18" fill="#222" text-anchor="start">확인하지 못했다. 지금은 라벨 시각을 그대로 읽는다(±1시간 차이 가능). 확인되면 읽는 규칙만 바꾸면 된다.</text><text x="0" y="617" font-size="18" fill="#444" text-anchor="start">원본 파일은 바꾸지 않고, 정리한 내용은 로그에 남긴다.</text></g></svg></body></html>
