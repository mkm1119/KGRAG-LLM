<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="503" viewBox="0 0 1000 503"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#44546a"/></marker><marker id="arg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2e7d32"/></marker><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78909c"/></marker></defs><rect width="1000" height="503" fill="#fff"/><g transform="translate(5,5) scale(0.99)"><text x="0" y="18" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="start">확인 항목과 기준</text><text x="4" y="42" font-size="15" font-weight="bold" fill="#555" text-anchor="start">확인 항목</text><text x="219" y="42" font-size="15" font-weight="bold" fill="#555" text-anchor="start">기준</text><text x="734" y="42" font-size="15" font-weight="bold" fill="#555" text-anchor="start">어긋날 때</text><rect x="0" y="52" width="200" height="31" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="72" font-size="15" fill="#222" text-anchor="start">의도</text><rect x="215" y="52" width="500" height="31" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="223" y="72" font-size="15" fill="#222" text-anchor="start">CQ1~CQ6 중 하나 이상</text><rect x="730" y="52" width="270" height="31" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="738" y="72" font-size="15" fill="#222" text-anchor="start">목록에 없는 의도는 “범위 밖”</text><rect x="0" y="87" width="200" height="52" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="107" font-size="15" fill="#222" text-anchor="start">댐</text><rect x="215" y="87" width="500" height="52" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="223" y="107" font-size="15" fill="#222" text-anchor="start">KG에 있는 4개 댐 중 하나. 표기는 KG의 이름으로 맞춘다 (충주 →</text><text x="223" y="128" font-size="15" fill="#222" text-anchor="start">충주댐)</text><rect x="730" y="87" width="270" height="52" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="738" y="107" font-size="15" fill="#222" text-anchor="start">KG에 없는 댐은 “범위 밖”</text><rect x="0" y="143" width="200" height="31" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="163" font-size="15" fill="#222" text-anchor="start">시점 (CQ2~CQ4)</text><rect x="215" y="143" width="500" height="31" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="223" y="163" font-size="15" fill="#222" text-anchor="start">날짜(2012-08-24), 기간(시작~끝), 전체 중 하나</text><rect x="730" y="143" width="270" height="31" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="738" y="163" font-size="15" fill="#222" text-anchor="start">형식이 틀리면 “시점 형식 오류”</text><rect x="0" y="178" width="200" height="52" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="198" font-size="15" fill="#222" text-anchor="start">대상 (CQ6)</text><rect x="215" y="178" width="500" height="52" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="223" y="198" font-size="15" fill="#222" text-anchor="start">대상 종류(승인, 운영행위, 운영기준)와 식별 값</text><rect x="730" y="178" width="270" height="52" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="738" y="198" font-size="15" fill="#222" text-anchor="start">종류가 목록에 없거나 식별 값이</text><text x="738" y="219" font-size="15" fill="#222" text-anchor="start">없으면 오류</text><text x="0" y="256" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="start">어긋나면 KG를 조회하지 않고 “범위 밖”과 사유를 돌려준다. 통과하면 다음 단계로 넘긴다</text><text x="4" y="280" font-size="15" font-weight="bold" fill="#555" text-anchor="start">LLM이 넘긴 값</text><text x="524" y="280" font-size="15" font-weight="bold" fill="#555" text-anchor="start">확인 결과</text><rect x="0" y="290" width="500" height="29" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="309" font-size="13" fill="#222" text-anchor="start">{"intent": ["CQ1","CQ5","CQ4","CQ3"], "dam": "충주댐", "period": "전체"}</text><rect x="520" y="290" width="480" height="29" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="528" y="309" font-size="13" fill="#222" text-anchor="start">통과 (예시 질문의 실제 출력)</text><rect x="0" y="323" width="500" height="29" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="342" font-size="13" fill="#222" text-anchor="start">{"intent": ["CQ4"], "dam": "충주", "period": {"at": "2012-08-24"}}</text><rect x="520" y="323" width="480" height="29" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="528" y="342" font-size="13" fill="#222" text-anchor="start">통과. 댐 표기를 “충주댐”으로 맞춤</text><rect x="0" y="356" width="500" height="29" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="375" font-size="13" fill="#222" text-anchor="start">{"intent": ["CQ4"], "dam": "팔당댐", "period": "전체"}</text><rect x="520" y="356" width="480" height="29" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="528" y="375" font-size="13" fill="#222" text-anchor="start">범위 밖. 팔당댐은 KG의 4개 댐이 아님</text><rect x="0" y="389" width="500" height="47" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="408" font-size="13" fill="#222" text-anchor="start">{"intent": [], "reason": "팔당댐은 허용된 댐 목록에 없습니다."}</text><rect x="520" y="389" width="480" height="47" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="528" y="408" font-size="13" fill="#222" text-anchor="start">조회하지 않음. 의도가 비면 사유를 그대로 전한다 (“팔당댐의 현재</text><text x="528" y="426" font-size="13" fill="#222" text-anchor="start">수위는?”의 실제 출력)</text><rect x="0" y="446" width="1000" height="30" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="8" y="465" font-size="14" fill="#222" text-anchor="start">첫 행과 마지막 행은 서버 실행의 실제 출력이고, 가운데 두 행은 확인 규칙을 보이기 위한 예이다.</text></g></svg></body></html>
