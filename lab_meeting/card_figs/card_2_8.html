xt-anchor="start">DAM:1003110 | damName | 충주댐</text><text x="10" y="205" font-size="14" fill="#222" text-anchor="start">OPR:1368:1 | operationType | 탄력적 방류</text><text x="10" y="224" font-size="14" fill="#222" text-anchor="start">OPR:1368:1 | operationTime |</text><text x="10" y="243" font-size="14" fill="#222" text-anchor="start">2012-08-24T15:00</text><rect x="0" y="262" width="300" height="72" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="10" y="283" font-size="14" fill="#222" text-anchor="start">관계 표 (시작 개체 | 관계 | 끝 개체)</text><text x="10" y="302" font-size="14" fill="#222" text-anchor="start">APR:1368 | authorizes | OPR:1368:1</text><text x="10" y="321" font-size="14" fill="#222" text-anchor="start">APR:1368 | concernsDam | DAM:1003110</text><line x1="302" y1="182" x2="338" y2="182" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="340" y="30" width="380" height="304" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="350" y="51" font-size="13" fill="#222" text-anchor="start">개체 한 행: 이 ID의 노드를 만들고 속성 값을 붙여라</text><text x="350" y="69" font-size="13" fill="#222" text-anchor="start">MERGE (n:Entity:Dam {id: 'DAM:1003110'})</text><text x="350" y="87" font-size="13" fill="#222" text-anchor="start">SET n.damName = '충주댐', n.damType = '다목적댐';</text><text x="350" y="105" font-size="13" fill="#222" text-anchor="start"></text><text x="350" y="123" font-size="13" fill="#222" text-anchor="start">관계 한 행: 두 노드를 찾아 이 이름의 선으로 이어라</text><text x="350" y="141" font-size="13" fill="#222" text-anchor="start">MATCH (a:Entity {id: 'APR:1368'}), (b:Entity {id:</text><text x="350" y="159" font-size="13" fill="#222" text-anchor="start">'OPR:1368:1'})</text><text x="350" y="177" font-size="13" fill="#222" text-anchor="start">MERGE (a)-[r:authorizes]->(b);</text><line x1="722" y1="182" x2="758" y2="182" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><rect x="760" y="30" width="240" height="304" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="772" y="54" font-size="15" fill="#222" text-anchor="start">Neo4j 적재</text><text x="772" y="75" font-size="15" fill="#222" text-anchor="start">같은 ID의 노드가 중복으로</text><text x="772" y="96" font-size="15" fill="#222" text-anchor="start">만들어지지 않도록 ID가</text><text x="772" y="117" font-size="15" fill="#222" text-anchor="start">유일해야 한다는 제약을 둔다</text><text x="0" y="368" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="start">4) 측정값 전체와 문서 원문은 Neo4j에 넣지 않고 각 저장소에 둔다. KG에는 찾아가는 키(stationCode, sourceLocator)만 둔다</text><text x="4" y="392" font-size="15" font-weight="bold" fill="#555" text-anchor="start">저장소</text><text x="254" y="392" font-size="15" font-weight="bold" fill="#555" text-anchor="start">보관하는 것</text><text x="714" y="392" font-size="15" font-weight="bold" fill="#555" text-anchor="start">규모와 만든 자료</text><rect x="0" y="402" width="230" height="33" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="9" y="423" font-size="15" fill="#222" text-anchor="start">KG (Neo4j)</text><rect x="250" y="402" width="440" height="33" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="259" y="423" font-size="15" fill="#222" text-anchor="start">개체와 관계, 근거의 위치(키)</text><rect x="710" y="402" width="290" height="33" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="719" y="423" font-size="15" fill="#222" text-anchor="start">개체 264, 관계 418  (① ② ③ ④)</text><rect x="0" y="439" width="230" height="33" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="9" y="460" font-size="15" fill="#222" text-anchor="start">측정자료 저장소</text><rect x="250" y="439" width="440" height="33" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="259" y="460" font-size="15" fill="#222" text-anchor="start">시간별 측정값 전체</text><rect x="710" y="439" width="290" height="33" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="719" y="460" font-size="15" fill="#222" text-anchor="start">508,246행  (②)</text><rect x="0" y="476" wid
