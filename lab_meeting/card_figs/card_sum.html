<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="391" viewBox="0 0 1000 391"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#44546a"/></marker><marker id="arg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2e7d32"/></marker><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78909c"/></marker></defs><rect width="1000" height="391" fill="#fff"/><g transform="translate(5,5) scale(0.99)"><text x="0" y="18" font-size="17" font-weight="bold" fill="#1f3a5f" text-anchor="start">연구 수행 과정과 이번주에 수정한 부분</text><rect x="0" y="34" width="172" height="180" rx="8" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="86" y="62" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Ontology</text><text x="86" y="112" font-size="14" fill="#222" text-anchor="middle">Class 6개</text><text x="86" y="132" font-size="14" fill="#222" text-anchor="middle">Relation 9개</text><line x1="86" y1="216" x2="86" y2="236" stroke="#b8860b" stroke-width="2" marker-end="url(#ar)"/><rect x="0" y="238" width="172" height="92" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="9" y="258" font-size="13" fill="#222" text-anchor="start">검증에서 Relation 1개 </text><text x="9" y="276" font-size="13" fill="#222" text-anchor="start">추가 (8개 → 9개)</text><rect x="207" y="34" width="172" height="180" rx="8" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="293" y="62" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="middle">KG 구축</text><text x="293" y="84" font-size="14" fill="#555" text-anchor="middle">(6단계)</text><text x="293" y="112" font-size="14" fill="#222" text-anchor="middle">전처리 → 구조화 자료 </text><text x="293" y="132" font-size="14" fill="#222" text-anchor="middle">매핑 → 문서 자료 추출 </text><text x="293" y="152" font-size="14" fill="#222" text-anchor="middle">→ 관계 연결 → 검증 →</text><text x="293" y="172" font-size="14" fill="#222" text-anchor="middle">저장</text><text x="293" y="192" font-size="14" fill="#222" text-anchor="middle">개체 264, 관계 418</text><line x1="174" y1="124" x2="205" y2="124" stroke="#222" stroke-width="3" marker-end="url(#ar)"/><line x1="293" y1="216" x2="293" y2="236" stroke="#b8860b" stroke-width="2" marker-end="url(#ar)"/><rect x="207" y="238" width="172" height="92" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="216" y="258" font-size="13" fill="#222" text-anchor="start">단계마다 근거 문헌 1개로</text><text x="216" y="276" font-size="13" fill="#222" text-anchor="start">재정리하고 재구축 (도달 </text><text x="216" y="294" font-size="13" fill="#222" text-anchor="start">가능 승인 63 → 80건)</text><rect x="414" y="34" width="172" height="180" rx="8" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="500" y="62" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="middle">질문 해석</text><text x="500" y="84" font-size="14" fill="#555" text-anchor="middle">(LLM)</text><text x="500" y="112" font-size="14" fill="#222" text-anchor="middle">질문 → 의도(CQ1~CQ6)</text><text x="500" y="132" font-size="14" fill="#222" text-anchor="middle">와 값(댐, 시점)</text><line x1="381" y1="124" x2="412" y2="124" stroke="#222" stroke-width="3" marker-end="url(#ar)"/><line x1="500" y1="216" x2="500" y2="236" stroke="#b8860b" stroke-width="2" marker-end="url(#ar)"/><rect x="414" y="238" width="172" height="92" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="423" y="258" font-size="13" fill="#222" text-anchor="start">의도를 CQ1~CQ6(여러 개 </text><text x="423" y="276" font-size="13" fill="#222" text-anchor="start">가능)으로 통일</text><rect x="621" y="34" width="172" height="180" rx="8" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="707" y="62" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="middle">근거 조회</text><text x="707" y="84" font-size="14" fill="#555" text-anchor="middle">(자동화)</text><text x="707" y="112" font-size="14" fill="#222" text-anchor="middle">입력 확인 → KG 조회 →</text><text x="707" y="132" font-size="14" fill="#222" text-anchor="middle">저장소 조회 → 근거</text><text x="707" y="152" font-size="14" fill="#222" text-anchor="middle">묶음 구성</text><line x1="588" y1="124" x2="619" y2="124" stroke="#222" stroke-width="3" marker-end="url(#ar)"/><line x1="707" y1="216" x2="707" y2="236" stroke="#b8860b" stroke-width="2" marker-end="url(#ar)"/><rect x="621" y="238" width="172" height="92" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="630" y="258" font-size="13" fill="#222" text-anchor="start">연구자가 정한 기준(시각 </text><text x="630" y="276" font-size="13" fill="#222" text-anchor="start">보정, 유사 사례 선별</text><text x="630" y="294" font-size="13" fill="#222" text-anchor="start">등)을 빼고 저장소 원값만 </text><text x="630" y="312" font-size="13" fill="#222" text-anchor="start">전달</text><rect x="828" y="34" width="172" height="180" rx="8" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="914" y="62" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="middle">답변 생성</text><text x="914" y="84" font-size="14" fill="#555" text-anchor="middle">(LLM)</text><text x="914" y="112" font-size="14" fill="#222" text-anchor="middle">근거 묶음 → 근거와</text><text x="914" y="132" font-size="14" fill="#222" text-anchor="middle">판단으로 나눈 답변</text><line x1="795" y1="124" x2="826" y2="124" stroke="#222" stroke-width="3" marker-end="url(#ar)"/><line x1="914" y1="216" x2="914" y2="236" stroke="#b8860b" stroke-width="2" marker-end="url(#ar)"/><rect x="828" y="238" width="172" height="92" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="837" y="258" font-size="13" fill="#222" text-anchor="start">비교·유사 판단은 LLM이 </text><text x="837" y="276" font-size="13" fill="#222" text-anchor="start">하고, 근거와 구분해 표시</text><rect x="0" y="344" width="1000" height="35" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="10" y="366" font-size="15" fill="#222" text-anchor="start">서버에서 Qwen3-32B-AWQ(4비트 양자화)로 예시 질문과 확인 질문 4개를 실행해 의도 추출, 근거 묶음, 답변을 점검하고 한계를 정리함 (3.9절)</text></g></svg></body></html>
