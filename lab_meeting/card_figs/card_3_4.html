<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="586" viewBox="0 0 1000 586"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#44546a"/></marker><marker id="arg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2e7d32"/></marker><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78909c"/></marker></defs><rect width="1000" height="586" fill="#fff"/><g transform="translate(5,5) scale(0.99)"><text x="0" y="20" font-size="24" font-weight="bold" fill="#1f3a5f" text-anchor="start">의도마다 미리 만든 Cypher 질의 틀에 단계 1을 통과한 댐과 값만 채워 실행한다</text><text x="4" y="52" font-size="18" font-weight="bold" fill="#555" text-anchor="start">의도</text><text x="124" y="52" font-size="18" font-weight="bold" fill="#555" text-anchor="start">질의 틀 (Cypher)</text><text x="779" y="52" font-size="18" font-weight="bold" fill="#555" text-anchor="start">뜻</text><rect x="0" y="64" width="110" height="77" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="84" font-size="17" fill="#222" text-anchor="start">CQ1, CQ2</text><rect x="120" y="64" width="640" height="77" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="126" y="84" font-size="17" fill="#222" text-anchor="start">MATCH (d:Dam {damName: $dam})</text><text x="126" y="107" font-size="17" fill="#222" text-anchor="start">-[:hasHydrometeorologicalState]->(h)</text><text x="126" y="130" font-size="17" fill="#222" text-anchor="start">RETURN h.variableType, h.stationCode</text><rect x="775" y="64" width="225" height="77" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="781" y="84" font-size="17" fill="#222" text-anchor="start">변수 종류와 측정값을</text><text x="781" y="107" font-size="17" fill="#222" text-anchor="start">찾아가는 키를 가져온다</text><rect x="0" y="145" width="110" height="123" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="165" font-size="17" fill="#222" text-anchor="start">CQ3</text><rect x="120" y="145" width="640" height="123" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="126" y="165" font-size="17" fill="#222" text-anchor="start">MATCH (o:Operation)</text><text x="126" y="188" font-size="17" fill="#222" text-anchor="start">-[:performedOnDam]->(d:Dam {damName: $dam})</text><text x="126" y="211" font-size="17" fill="#222" text-anchor="start">OPTIONAL MATCH (a:Approval)-[:authorizes]->(o)</text><text x="126" y="234" font-size="17" fill="#222" text-anchor="start">RETURN o.id, o.operationType, o.operationTime,</text><text x="126" y="257" font-size="17" fill="#222" text-anchor="start">a.id, a.approvalTime, a.approvalContent</text><rect x="775" y="145" width="225" height="123" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="781" y="165" font-size="17" fill="#222" text-anchor="start">운영행위와 허가한 승인을 </text><text x="781" y="188" font-size="17" fill="#222" text-anchor="start">함께 가져온다</text><rect x="0" y="272" width="110" height="77" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="292" font-size="17" fill="#222" text-anchor="start">CQ4</text><rect x="120" y="272" width="640" height="77" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="126" y="292" font-size="17" fill="#222" text-anchor="start">MATCH (a:Approval)</text><text x="126" y="315" font-size="17" fill="#222" text-anchor="start">-[:concernsDam]->(d:Dam {damName: $dam})</text><text x="126" y="338" font-size="17" fill="#222" text-anchor="start">RETURN a.id, a.approvalTime, a.approvalContent</text><rect x="775" y="272" width="225" height="77" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="781" y="292" font-size="17" fill="#222" text-anchor="start">그 댐에 관한 승인을</text><text x="781" y="315" font-size="17" fill="#222" text-anchor="start">가져온다</text><rect x="0" y="353" width="110" height="77" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="373" font-size="17" fill="#222" text-anchor="start">CQ5</text><rect x="120" y="353" width="640" height="77" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="126" y="373" font-size="17" fill="#222" text-anchor="start">MATCH (c:Criterion)</text><text x="126" y="396" font-size="17" fill="#222" text-anchor="start">-[:appliesToDam]->(d:Dam {damName: $dam})</text><text x="126" y="419" font-size="17" fill="#222" text-anchor="start">RETURN c.id, c.criterionType, c.criterionValue, c.unit</text><rect x="775" y="353" width="225" height="77" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="781" y="373" font-size="17" fill="#222" text-anchor="start">적용되는 운영기준을</text><text x="781" y="396" font-size="17" fill="#222" text-anchor="start">가져온다</text><rect x="0" y="434" width="110" height="77" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="6" y="454" font-size="17" fill="#222" text-anchor="start">CQ6</text><rect x="120" y="434" width="640" height="77" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="126" y="454" font-size="17" fill="#222" text-anchor="start">MATCH (x:Entity {id: $id})</text><text x="126" y="477" font-size="17" fill="#222" text-anchor="start">-[:supportedBy]->(e:EvidenceSource)</text><text x="126" y="500" font-size="17" fill="#222" text-anchor="start">RETURN e.id, e.sourceTitle, e.sourceType, e.sourceLocator</text><rect x="775" y="434" width="225" height="77" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="781" y="454" font-size="17" fill="#222" text-anchor="start">대상 개체의 근거자료를</text><text x="781" y="477" font-size="17" fill="#222" text-anchor="start">가져온다</text><rect x="0" y="519" width="1000" height="61" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="8" y="542" font-size="18" fill="#222" text-anchor="start">CQ2~CQ4에 시점이 지정되면 WHERE 조건으로 기간을 건다. 전체이면 조건 없이 전부 가져온다. LLM이 질의를 쓰지</text><text x="8" y="566" font-size="18" fill="#222" text-anchor="start">않으므로 어떤 질의가 실행되었는지 확인할 수 있고, 같은 입력이면 같은 결과가 나온다.</text></g></svg></body></html>
