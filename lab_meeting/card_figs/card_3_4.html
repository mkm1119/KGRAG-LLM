<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="961" viewBox="0 0 1000 961"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#44546a"/></marker><marker id="arg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2e7d32"/></marker><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78909c"/></marker></defs><rect width="1000" height="961" fill="#fff"/><g transform="translate(5,5) scale(0.99)"><text x="0" y="18" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="start">의도마다 미리 만든 Cypher 질의 틀에 단계 1을 통과한 댐과 값만 채워 실행한다</text><text x="4" y="42" font-size="15" font-weight="bold" fill="#555" text-anchor="start">의도</text><text x="169" y="42" font-size="15" font-weight="bold" fill="#555" text-anchor="start">질의 틀 (Cypher)</text><text x="704" y="42" font-size="15" font-weight="bold" fill="#555" text-anchor="start">뜻</text><rect x="0" y="52" width="150" height="45" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="70" font-size="12" fill="#222" text-anchor="start">CQ1, CQ2</text><rect x="165" y="52" width="520" height="45" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="173" y="70" font-size="12" fill="#222" text-anchor="start">MATCH (d:Dam {damName: $dam})-[:hasHydrometeorologicalState]->(h)</text><text x="173" y="87" font-size="12" fill="#222" text-anchor="start">RETURN h.variableType, h.stationCode</text><rect x="700" y="52" width="300" height="45" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="708" y="70" font-size="12" fill="#222" text-anchor="start">상태 개체에서 변수 종류와 측정값을 찾아가는 키를 </text><text x="708" y="87" font-size="12" fill="#222" text-anchor="start">가져온다</text><rect x="0" y="101" width="150" height="79" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="119" font-size="12" fill="#222" text-anchor="start">CQ3</text><rect x="165" y="101" width="520" height="79" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="173" y="119" font-size="12" fill="#222" text-anchor="start">MATCH (o:Operation)-[:performedOnDam]->(d:Dam {damName: $dam})</text><text x="173" y="136" font-size="12" fill="#222" text-anchor="start">OPTIONAL MATCH (a:Approval)-[:authorizes]->(o)</text><text x="173" y="153" font-size="12" fill="#222" text-anchor="start">RETURN o.id, o.operationType, o.operationTime, a.id, a.approvalTime,</text><text x="173" y="170" font-size="12" fill="#222" text-anchor="start">a.approvalContent</text><rect x="700" y="101" width="300" height="79" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="708" y="119" font-size="12" fill="#222" text-anchor="start">그 댐의 운영행위와 허가한 승인을 함께 가져온다</text><rect x="0" y="184" width="150" height="45" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="202" font-size="12" fill="#222" text-anchor="start">CQ4</text><rect x="165" y="184" width="520" height="45" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="173" y="202" font-size="12" fill="#222" text-anchor="start">MATCH (a:Approval)-[:concernsDam]->(d:Dam {damName: $dam})</text><text x="173" y="219" font-size="12" fill="#222" text-anchor="start">RETURN a.id, a.approvalTime, a.approvalContent</text><rect x="700" y="184" width="300" height="45" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="708" y="202" font-size="12" fill="#222" text-anchor="start">그 댐에 관한 승인을 가져온다</text><rect x="0" y="233" width="150" height="45" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="251" font-size="12" fill="#222" text-anchor="start">CQ5</text><rect x="165" y="233" width="520" height="45" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="173" y="251" font-size="12" fill="#222" text-anchor="start">MATCH (c:Criterion)-[:appliesToDam]->(d:Dam {damName: $dam})</text><text x="173" y="268" font-size="12" fill="#222" text-anchor="start">RETURN c.id, c.criterionType, c.criterionValue, c.unit</text><rect x="700" y="233" width="300" height="45" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="708" y="251" font-size="12" fill="#222" text-anchor="start">그 댐에 적용되는 운영기준을 가져온다</text><rect x="0" y="282" width="150" height="45" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="300" font-size="12" fill="#222" text-anchor="start">CQ6</text><rect x="165" y="282" width="520" height="45" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="173" y="300" font-size="12" fill="#222" text-anchor="start">MATCH (x:Entity {id: $id})-[:supportedBy]->(e:EvidenceSource)</text><text x="173" y="317" font-size="12" fill="#222" text-anchor="start">RETURN e.id, e.sourceTitle, e.sourceType, e.sourceLocator</text><rect x="700" y="282" width="300" height="45" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="708" y="300" font-size="12" fill="#222" text-anchor="start">대상 개체의 근거자료를 가져온다</text><rect x="0" y="335" width="1000" height="53" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="10" y="356" font-size="14" fill="#222" text-anchor="start">CQ2~CQ4에 시점이 지정되면 WHERE 조건으로 기간을 건다. 전체이면 조건 없이 전부 가져온다. LLM이 질의를 쓰지 않으므로 어떤 질의가 실행되었는지</text><text x="10" y="375" font-size="14" fill="#222" text-anchor="start">확인할 수 있고, 같은 입력이면 같은 결과가 나온다.</text><text x="0" y="423" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="start">예시 질문에서 따라간 경로: 의도 4개 모두 “충주댐” 노드에서 출발해 화살표 순서대로 관계를 따라간다</text><rect x="0" y="435" width="78" height="74" rx="8" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="39" y="479" font-size="20" font-weight="bold" fill="#1f3a5f" text-anchor="middle">CQ5</text><rect x="96" y="439" width="150" height="66" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="104" y="458" font-size="14" fill="#222" text-anchor="start">Dam</text><text x="104" y="477" font-size="14" fill="#222" text-anchor="start">충주댐</text><line x1="252" y1="472" x2="364" y2="472" stroke="#d9b44a" stroke-width="3" marker-end="url(#ar)"/><text x="308" y="463" font-size="15" font-weight="bold" fill="#d9b44a" text-anchor="middle">1</text><text x="308" y="493" font-size="11" fill="#444" text-anchor="middle">appliesToDam을</text><text x="308" y="506" font-size="11" fill="#444" text-anchor="middle">거꾸로</text><rect x="370" y="439" width="200" height="66" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="378" y="458" font-size="14" fill="#222" text-anchor="start">Criterion CRI:CR-02</text><text x="378" y="477" font-size="14" fill="#222" text-anchor="start">홍수기 제한수위 138.0 EL.m</text><rect x="96" y="515" width="904" height="30" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="104" y="534" font-size="14" fill="#222" text-anchor="start">→ 가져온 것: 제한수위 138.0 EL.m, 별표3을 찾아가는 키(sourceLocator)</text><rect x="0" y="565" width="78" height="74" rx="8" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="39" y="609" font-size="20" font-weight="bold" fill="#1f3a5f" text-anchor="middle">CQ3</text><rect x="96" y="569" width="150" height="66" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="104" y="588" font-size="14" fill="#222" text-anchor="start">Dam</text><text x="104" y="607" font-size="14" fill="#222" text-anchor="start">충주댐</text><line x1="252" y1="602" x2="364" y2="602" stroke="#4a78b5" stroke-width="3" marker-end="url(#ar)"/><text x="308" y="593" font-size="15" font-weight="bold" fill="#4a78b5" text-anchor="middle">1</text><text x="308" y="623" font-size="11" fill="#444" text-anchor="middle">performedOnDam을</text><text x="308" y="636" font-size="11" fill="#444" text-anchor="middle">거꾸로</text><rect x="370" y="569" width="200" height="66" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="378" y="588" font-size="14" fill="#222" text-anchor="start">Operation OPR:1368:1 외</text><text x="378" y="607" font-size="14" fill="#222" text-anchor="start">탄력적 방류 2012-08-24</text><text x="378" y="626" font-size="14" fill="#222" text-anchor="start">15:00</text><line x1="576" y1="602" x2="688" y2="602" stroke="#4a78b5" stroke-width="3" marker-end="url(#ar)"/><text x="632" y="593" font-size="15" font-weight="bold" fill="#4a78b5" text-anchor="middle">2</text><text x="632" y="623" font-size="11" fill="#444" text-anchor="middle">authorizes를</text><text x="632" y="636" font-size="11" fill="#444" text-anchor="middle">거꾸로</text><rect x="694" y="569" width="200" height="66" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="702" y="588" font-size="14" fill="#222" text-anchor="start">Approval APR:1368 외</text><text x="702" y="607" font-size="14" fill="#222" text-anchor="start">승인일 2012-08-24,</text><text x="702" y="626" font-size="14" fill="#222" text-anchor="start">2000㎥/s</text><rect x="96" y="645" width="904" height="30" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="104" y="664" font-size="14" fill="#222" text-anchor="start">→ 가져온 것: 운영행위 14개와 각각을 허가한 승인</text><rect x="0" y="695" width="78" height="74" rx="8" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="39" y="739" font-size="20" font-weight="bold" fill="#1f3a5f" text-anchor="middle">CQ4</text><rect x="96" y="699" width="150" height="66" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="104" y="718" font-size="14" fill="#222" text-anchor="start">Dam</text><text x="104" y="737" font-size="14" fill="#222" text-anchor="start">충주댐</text><line x1="252" y1="732" x2="364" y2="732" stroke="#4a78b5" stroke-width="3" marker-end="url(#ar)"/><text x="308" y="723" font-size="15" font-weight="bold" fill="#4a78b5" text-anchor="middle">1</text><text x="308" y="753" font-size="11" fill="#444" text-anchor="middle">concernsDam을</text><text x="308" y="766" font-size="11" fill="#444" text-anchor="middle">거꾸로</text><rect x="370" y="699" width="200" height="66" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="378" y="718" font-size="14" fill="#222" text-anchor="start">Approval APR:1368 외</text><text x="378" y="737" font-size="14" fill="#222" text-anchor="start">승인 15건</text><rect x="96" y="775" width="904" height="30" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="104" y="794" font-size="14" fill="#222" text-anchor="start">→ 가져온 것: 방류 승인 15건 = 운영행위에 연결된 13건 + Operation이 없는 변경 승인 2건</text><rect x="0" y="825" width="78" height="74" rx="8" fill="#fff3e6" stroke="#e08a1e" stroke-width="2"/><text x="39" y="869" font-size="20" font-weight="bold" fill="#1f3a5f" text-anchor="middle">CQ1</text><rect x="96" y="829" width="150" height="66" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="104" y="848" font-size="14" fill="#222" text-anchor="start">Dam</text><text x="104" y="867" font-size="14" fill="#222" text-anchor="start">충주댐</text><line x1="252" y1="862" x2="364" y2="862" stroke="#e08a1e" stroke-width="3" marker-end="url(#ar)"/><text x="308" y="853" font-size="15" font-weight="bold" fill="#e08a1e" text-anchor="middle">1</text><text x="308" y="883" font-size="11" fill="#444" text-anchor="middle">hasHydrometeo</text><text x="308" y="896" font-size="11" fill="#444" text-anchor="middle">rologicalState</text><rect x="370" y="829" width="200" height="66" rx="6" fill="#fff3e6" stroke="#e08a1e" stroke-width="2"/><text x="378" y="848" font-size="14" fill="#222" text-anchor="start">HMS:1003110:수위 외</text><text x="378" y="867" font-size="14" fill="#222" text-anchor="start">상태 6개 (변수 종류)</text><rect x="96" y="905" width="904" height="30" rx="6" fill="#fff" stroke="#888" stroke-width="2"/><text x="104" y="924" font-size="14" fill="#222" text-anchor="start">→ 가져온 것: 변수 6개와 측정값을 찾아가는 키 stationCode 1003110 (값 자체는 다음 단계에서 저장소에서 읽음)</text></g></svg></body></html>
