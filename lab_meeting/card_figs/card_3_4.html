<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="816" viewBox="0 0 1000 816"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#44546a"/></marker><marker id="arg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2e7d32"/></marker><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78909c"/></marker></defs><rect width="1000" height="816" fill="#fff"/><g transform="translate(5,5) scale(0.99)"><text x="0" y="18" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="start">의도마다 미리 만든 Cypher 질의 틀에 단계 1을 통과한 댐과 값만 채워 실행한다</text><text x="4" y="42" font-size="15" font-weight="bold" fill="#555" text-anchor="start">의도</text><text x="169" y="42" font-size="15" font-weight="bold" fill="#555" text-anchor="start">질의 틀 (Cypher)</text><text x="704" y="42" font-size="15" font-weight="bold" fill="#555" text-anchor="start">뜻</text><rect x="0" y="52" width="150" height="45" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="70" font-size="12" fill="#222" text-anchor="start">CQ1, CQ2</text><rect x="165" y="52" width="520" height="45" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="173" y="70" font-size="12" fill="#222" text-anchor="start">MATCH (d:Dam {damName: $dam})-[:hasHydrometeorologicalState]->(h)</text><text x="173" y="87" font-size="12" fill="#222" text-anchor="start">RETURN h.variableType, h.stationCode</text><rect x="700" y="52" width="300" height="45" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="708" y="70" font-size="12" fill="#222" text-anchor="start">상태 개체에서 변수 종류와 측정값을 찾아가는 키를 </text><text x="708" y="87" font-size="12" fill="#222" text-anchor="start">가져온다</text><rect x="0" y="101" width="150" height="79" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="119" font-size="12" fill="#222" text-anchor="start">CQ3</text><rect x="165" y="101" width="520" height="79" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="173" y="119" font-size="12" fill="#222" text-anchor="start">MATCH (o:Operation)-[:performedOnDam]->(d:Dam {damName: $dam})</text><text x="173" y="136" font-size="12" fill="#222" text-anchor="start">OPTIONAL MATCH (a:Approval)-[:authorizes]->(o)</text><text x="173" y="153" font-size="12" fill="#222" text-anchor="start">RETURN o.id, o.operationType, o.operationTime, a.id, a.approvalTime,</text><text x="173" y="170" font-size="12" fill="#222" text-anchor="start">a.approvalContent</text><rect x="700" y="101" width="300" height="79" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="708" y="119" font-size="12" fill="#222" text-anchor="start">그 댐의 운영행위와 허가한 승인을 함께 가져온다</text><rect x="0" y="184" width="150" height="45" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="202" font-size="12" fill="#222" text-anchor="start">CQ4</text><rect x="165" y="184" width="520" height="45" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="173" y="202" font-size="12" fill="#222" text-anchor="start">MATCH (a:Approval)-[:concernsDam]->(d:Dam {damName: $dam})</text><text x="173" y="219" font-size="12" fill="#222" text-anchor="start">RETURN a.id, a.approvalTime, a.approvalContent</text><rect x="700" y="184" width="300" height="45" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="708" y="202" font-size="12" fill="#222" text-anchor="start">그 댐에 관한 승인을 가져온다</text><rect x="0" y="233" width="150" height="45" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="251" font-size="12" fill="#222" text-anchor="start">CQ5</text><rect x="165" y="233" width="520" height="45" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="173" y="251" font-size="12" fill="#222" text-anchor="start">MATCH (c:Criterion)-[:appliesToDam]->(d:Dam {damName: $dam})</text><text x="173" y="268" font-size="12" fill="#222" text-anchor="start">RETURN c.id, c.criterionType, c.criterionValue, c.unit</text><rect x="700" y="233" width="300" height="45" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="708" y="251" font-size="12" fill="#222" text-anchor="start">그 댐에 적용되는 운영기준을 가져온다</text><rect x="0" y="282" width="150" height="45" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="8" y="300" font-size="12" fill="#222" text-anchor="start">CQ6</text><rect x="165" y="282" width="520" height="45" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="173" y="300" font-size="12" fill="#222" text-anchor="start">MATCH (x:Entity {id: $id})-[:supportedBy]->(e:EvidenceSource)</text><text x="173" y="317" font-size="12" fill="#222" text-anchor="start">RETURN e.id, e.sourceTitle, e.sourceType, e.sourceLocator</text><rect x="700" y="282" width="300" height="45" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="708" y="300" font-size="12" fill="#222" text-anchor="start">대상 개체의 근거자료를 가져온다</text><rect x="0" y="335" width="1000" height="53" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="10" y="356" font-size="14" fill="#222" text-anchor="start">CQ2~CQ4에 시점이 지정되면 WHERE 조건으로 기간을 건다. 전체이면 조건 없이 전부 가져온다. LLM이 질의를 쓰지 않으므로 어떤 질의가 실행되었는지</text><text x="10" y="375" font-size="14" fill="#222" text-anchor="start">확인할 수 있고, 같은 입력이면 같은 결과가 나온다.</text><text x="0" y="423" font-size="19" font-weight="bold" fill="#1f3a5f" text-anchor="start">예시 질문의 KG 조회 결과: 충주댐에서 따라간 경로</text><rect x="440" y="563" width="150" height="60" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="448" y="584" font-size="16" fill="#222" text-anchor="start">Dam</text><text x="448" y="606" font-size="16" fill="#222" text-anchor="start">충주댐</text><rect x="40" y="439" width="230" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="48" y="458" font-size="14" fill="#222" text-anchor="start">APR:1368</text><text x="48" y="477" font-size="14" fill="#222" text-anchor="start">승인일 2012-08-24, 2000㎥/s</text><rect x="40" y="555" width="230" height="56" rx="6" fill="#e8f1fb" stroke="#4a78b5" stroke-width="2"/><text x="48" y="574" font-size="14" fill="#222" text-anchor="start">OPR:1368:1</text><text x="48" y="593" font-size="14" fill="#222" text-anchor="start">탄력적 방류, 2012-08-24 15:00</text><rect x="40" y="671" width="230" height="56" rx="6" fill="#f1f1f1" stroke="#888" stroke-width="2"/><text x="48" y="690" font-size="14" fill="#222" text-anchor="start">(변경 승인 2건)</text><text x="48" y="709" font-size="14" fill="#222" text-anchor="start">Operation이 없는 승인</text><rect x="730" y="439" width="250" height="56" rx="6" fill="#fff8dc" stroke="#d9b44a" stroke-width="2"/><text x="738" y="458" font-size="14" fill="#222" text-anchor="start">Criterion CRI:CR-02</text><text x="738" y="477" font-size="14" fill="#222" text-anchor="start">홍수기 제한수위 138.0 EL.m</text><rect x="730" y="555" width="250" height="92" rx="6" fill="#fff3e6" stroke="#e08a1e" stroke-width="2"/><text x="738" y="574" font-size="13" fill="#222" text-anchor="start">상태 6개 (HMS:1003110:*)</text><text x="738" y="592" font-size="13" fill="#222" text-anchor="start">수위, 저수량, 강우량, 유입량,</text><text x="738" y="610" font-size="13" fill="#222" text-anchor="start">총방류량, 저수율</text><text x="738" y="628" font-size="13" fill="#222" text-anchor="start">stationCode 1003110</text><line x1="155" y1="495" x2="155" y2="553" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><text x="165" y="529" font-size="13" fill="#222" text-anchor="start">authorizes</text><line x1="272" y1="583" x2="438" y2="593" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><text x="300" y="603" font-size="13" fill="#222" text-anchor="start">performedOnDam</text><line x1="272" y1="473" x2="438" y2="575" stroke="#b35c00" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><text x="330" y="497" font-size="13" fill="#b35c00" text-anchor="start">concernsDam</text><line x1="272" y1="699" x2="438" y2="609" stroke="#b35c00" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/><line x1="730" y1="475" x2="592" y2="579" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><text x="745" y="535" font-size="13" fill="#222" text-anchor="start">appliesToDam</text><line x1="592" y1="601" x2="728" y2="585" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><text x="500" y="631" font-size="13" fill="#222" text-anchor="start">hasHydrometeorologicalState</text><rect x="0" y="747" width="1000" height="53" rx="6" fill="#e8f6ea" stroke="#4c9a5a" stroke-width="2"/><text x="10" y="768" font-size="14" fill="#222" text-anchor="start">CQ4: 충주댐에 관한 승인 15건 = 운영행위에 연결된 13건 + 변경 승인 2건.   CQ3: 운영행위 14개와 허가한 승인.   CQ5: 제한수위 138.0.   CQ1: 값이</text><text x="10" y="787" font-size="14" fill="#222" text-anchor="start">아니라 측정값을 찾아가는 키만 돌려준다.</text></g></svg></body></html>
