<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}svg text{font-family:'WenQuanYi Zen Hei','Noto Sans CJK KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="965" viewBox="0 0 1500 965"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#44546a"/></marker><marker id="arg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2e7d32"/></marker><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7e57c2"/></marker><marker id="arh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78909c"/></marker></defs><rect width="1500" height="965" fill="#fff"/><text x="40" y="52" font-size="32" font-weight="bold" fill="#1f4e79" text-anchor="start">자료를 두 경로로 나눈다: 열과 행의 의미가 자료에 정해져 있는가?</text><rect x="40" y="90" width="450" height="215" rx="14" fill="#eceff1" stroke="#78909c" stroke-width="3"/><text x="265" y="134" font-size="28" font-weight="bold" fill="#263238" text-anchor="middle">① 방류 승인 기록</text><text x="265" y="182" font-size="24" fill="#37474f" text-anchor="middle">표 파일 · 한 행 = 승인 1건</text><text x="265" y="216" font-size="24" fill="#37474f" text-anchor="middle">1368 | 1003110 | 2012-08-24 |</text><text x="265" y="250" font-size="24" fill="#37474f" text-anchor="middle">… | 이내 탄력적 조정</text><rect x="525" y="90" width="450" height="215" rx="14" fill="#eceff1" stroke="#78909c" stroke-width="3"/><text x="750" y="134" font-size="28" font-weight="bold" fill="#263238" text-anchor="middle">② 수문기상 시간 자료</text><text x="750" y="182" font-size="24" fill="#37474f" text-anchor="middle">표 파일 · 한 행 = 한 시각</text><text x="750" y="216" font-size="24" fill="#37474f" text-anchor="middle">1012110 | 2017082515 |</text><text x="750" y="250" font-size="24" fill="#37474f" text-anchor="middle">192.53 | 1027.58 | …</text><rect x="1010" y="90" width="450" height="215" rx="14" fill="#eceff1" stroke="#78909c" stroke-width="3"/><text x="1235" y="134" font-size="28" font-weight="bold" fill="#263238" text-anchor="middle">③ 규정 별표3</text><text x="1235" y="182" font-size="24" fill="#37474f" text-anchor="middle">글 · 선 문자로 그린 표</text><text x="1235" y="216" font-size="24" fill="#37474f" text-anchor="middle">│충 주 댐  │138.0 │ -</text><text x="1235" y="250" font-size="24" fill="#37474f" text-anchor="middle">│소양강댐  │190.3 │ -</text><rect x="40" y="390" width="1420" height="110" rx="14" fill="#ede7f6" stroke="#7e57c2" stroke-width="3"/><text x="750" y="434" font-size="30" font-weight="bold" fill="#311b92" text-anchor="middle">판단: 열과 행의 의미가 자료에 정해져 있는가?</text><text x="750" y="483" font-size="25" fill="#37474f" text-anchor="middle">표 파일은 첫 줄에 열 이름이 있다.  별표3는 선으로 그렸을 뿐 열 이름이 없는 글이다.</text><line x1="265" y1="307" x2="265" y2="388" stroke="#7e57c2" stroke-width="4" marker-end="url(#arp)"/><line x1="750" y1="307" x2="750" y2="388" stroke="#7e57c2" stroke-width="4" marker-end="url(#arp)"/><line x1="1235" y1="307" x2="1235" y2="388" stroke="#7e57c2" stroke-width="4" marker-end="url(#arp)"/><rect x="40" y="595" width="690" height="285" rx="14" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/><text x="385" y="639" font-size="30" font-weight="bold" fill="#0d47a1" text-anchor="middle">표 경로  (예: ①, ②)</text><text x="385" y="687" font-size="24" fill="#37474f" text-anchor="middle">열 이름을 보고 값을 속성에 그대로 옮긴다.</text><text x="385" y="721" font-size="24" fill="#37474f" text-anchor="middle">해석을 더하지 않아 같은 표는 항상 같은 결과다.</text><text x="385" y="755" font-size="24" fill="#37474f" text-anchor="middle">예) 승인일 열 “2012-08-24” → 승인일 속성</text><text x="385" y="789" font-size="24" fill="#37474f" text-anchor="middle">→ 단계 3. 구조화 자료 매핑</text><rect x="770" y="595" width="690" height="285" rx="14" fill="#e0f2f1" stroke="#00796b" stroke-width="3"/><text x="1115" y="639" font-size="30" font-weight="bold" fill="#004d40" text-anchor="middle">글 경로  (예: ③)</text><text x="1115" y="687" font-size="24" fill="#37474f" text-anchor="middle">글 속의 낱말과 패턴을 찾아 값을 뽑는다.</text><text x="1115" y="721" font-size="24" fill="#37474f" text-anchor="middle">해석이 필요하여 오류가 생길 수 있다.</text><text x="1115" y="755" font-size="24" fill="#37474f" text-anchor="middle">예) “충 주 댐 │138.0” → 충주댐 제한수위 138.0</text><text x="1115" y="789" font-size="24" fill="#37474f" text-anchor="middle">승인 기록의 비고 문장(“이내 탄력적 조정”)도 여기서</text><text x="1115" y="823" font-size="24" fill="#37474f" text-anchor="middle">→ 단계 4. 비정형 텍스트 추출</text><line x1="385" y1="502" x2="385" y2="593" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><text x="410" y="558" font-size="28" font-weight="bold" fill="#0d47a1" text-anchor="start">예  (① ②)</text><line x1="1115" y1="502" x2="1115" y2="593" stroke="#44546a" stroke-width="4" marker-end="url(#ar)"/><text x="1140" y="558" font-size="28" font-weight="bold" fill="#004d40" text-anchor="start">아니오  (③, ①의 비고 문장)</text><text x="40" y="932" font-size="26" fill="#44546a" text-anchor="start">해석이 들어가는 부분이 글 경로 한 곳에 모이므로, 어디를 검토해야 하는지가 분명해진다.</text></svg></body></html>
