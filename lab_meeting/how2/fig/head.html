<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>개체 해소·연결, 저장, 검색·답변 그림</title>
<style>
:root{--key:#E07A2F;--cls:#23907F;--prop:#3F8F2A;--merge:#8A55C2;--rel:#2F66D0;--prov:#7A7A7A;--line:#C9C9C9}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#222;font-family:"WenQuanYi Zen Hei",sans-serif;font-size:17px;line-height:1.45}
.fig{width:840px;padding:14px 16px;margin:0 0 30px;background:#fff}
.mono{font-family:"DejaVu Sans Mono",monospace;font-size:15.5px}
.chip{white-space:nowrap;display:inline-block;border:1.5px solid var(--line);border-radius:6px;padding:4px 10px;background:#fff}
.id{white-space:nowrap;display:inline-block;border:2.5px solid var(--key);border-radius:7px;padding:4px 11px;background:#FFF4EA;font-weight:bold}
.tag{display:inline-block;border-radius:5px;padding:2px 9px;color:#fff;font-weight:bold}
.arr{color:#555;font-size:22px;padding:0 8px}
.line{display:flex;align-items:center;flex-wrap:nowrap;margin:8px 0}
.d2rq{background:#FFF8E6;border:1.5px dashed #D9B44A;border-radius:8px;padding:8px 12px;font-size:15px;margin-top:12px}
.d2rq b{color:#8A6A00}
.note{color:#555;font-size:15px}
.box{border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;background:#F7F7F5}
table.t{border-collapse:collapse;font-size:15.5px}
table.t th,table.t td{border:1px solid var(--line);padding:4px 10px}
table.t th{background:#555;color:#fff}
table.t tr.hl td{background:#FFF1C9;font-weight:bold}
table.t tr.dim td{color:#999}
.row3{display:grid;grid-template-columns:250px 30px 270px 30px 1fr;align-items:center;gap:0;margin:10px 0}
.cv{border:1.5px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff;font-size:15.5px}
.rl{border-radius:7px;padding:6px 9px;background:#EFEFEB;font-size:15px}
.out{border-radius:7px;padding:6px 9px;background:#EEF6EA;border:1.5px solid #B9D8AE;font-size:15.5px}
.ar{text-align:center;color:#555;font-size:20px}
.sub{font-size:14px;color:#8A6A00;margin:2px 0 0 0}
.warn{color:#B3261E;font-weight:bold}
.hd{font-size:14px;color:#666;font-weight:bold}
</style></head><body>
